/* ---------- 2. Altstadt / Hauptplatz – Pfarrkirche St. Rupert, Schloss Stibichhofen, bunte Fassaden ---------- */
(function () {
  // --- Paletten (einmal angelegt; nachts über PAL abgedunkelt, nur bei Änderung von env.night neu gerechnet) ---
  const WALLS = ['#F6D7A7', '#F9C6C6', '#CFE6F5', '#F7EBA8', '#D8EBC8', '#E7D4EE', '#FFF6E8', '#F4C08E'];
  const ROOFS = ['#B5533C', '#8E4B3B', '#7A8290', '#A0523F'];
  const SHUTTERS = ['#3E6B3A', '#7A4B23', '#3C5A99', '#8B3A2E', '#4A6A8A'];
  const SIGNS = ['CAFÉ', 'BÄCKEREI', 'EIS', 'TRAFIK', 'APOTHEKE', 'BÜCHER', 'GASTHAUS', 'KONDITOREI'];
  const HANG = ['Café', 'Eis', 'Kebap', 'Pizza'];
  const AWNING = [COLOR_ACCENT, '#C8102E', '#3C5A99', '#3E6B3A'];
  const FLOWERS = ['#FF5C8A', '#FFE45C', COLOR_ACCENT, '#FFFFFF', '#C8102E'];
  const BUNT = [COLOR_PRIMARY, COLOR_ACCENT, '#FFFFFF', '#5CC8FF'];
  const NUMS = ['1', '2', '3', '4', '5'];
  const NIGHT_TINT = '#2B3358';
  // Text-Optionen einmal anlegen (txt() pro Frame ohne neue Objekte)
  const T_MUSEUM = { size: 17, color: COLOR_INK }, T_SIGN = { size: 12, color: COLOR_INK }, T_HANG = { size: 12, color: COLOR_ACCENT };
  const T_STREET = { size: 12, color: COLOR_INK }, T_FEST = { size: 12, color: '#FFFFFF' }, T_EIS = { size: 14, color: COLOR_ACCENT };
  const T_CHALK = { size: 14, color: '#FFFFFF' }, T_T = { size: 11, color: COLOR_PRIMARY };
  const WATER_70 = H.rgba(COLOR_WATER, 0.7);   // Brunnenbecken (einmal gerechnet, kein String pro Frame)
  const FAR = {
    nave: '#F4EBD6', tower: '#EFE2C4', naveRoof: '#A94A3B', helm: '#4F7F6E',
    castle: '#F3E3B8', castleTower: '#EADBB0', castleRoof: '#9C4F3F',
    leaf: '#4E9E34', trunk: '#5A3A1E', win: '#7FB6E0',
  };
  const PAL = { night: -9, wall: WALLS.slice(), roof: ROOFS.slice(), far: Object.assign({}, FAR) };
  function updatePal(night) {
    if (Math.abs(night - PAL.night) < 0.015) return;
    PAL.night = night;
    for (let k = 0; k < WALLS.length; k++) PAL.wall[k] = H.lerpColor(WALLS[k], NIGHT_TINT, night * 0.4);
    for (let k = 0; k < ROOFS.length; k++) PAL.roof[k] = H.lerpColor(ROOFS[k], NIGHT_TINT, night * 0.4);
    for (const k in FAR) PAL.far[k] = H.lerpColor(FAR[k], NIGHT_TINT, night * 0.55);
    PAL.far.win = H.lerpColor('#7FB6E0', '#FFE27A', night);   // Kirchen-/Bogenfenster leuchten nachts
  }
  // Staub der Kehrmaschine (einmal angelegt)
  const DUST = { vx: [-140, -40], vy: [-70, -20], g: 90, life: 0.55, size: [3, 6], color: ['#CFC6B4', '#B9B3A6', '#E4DCCB'], scroll: 1 };
  let bellAt = -1e9;   // Sekunde des letzten Glockenschlags (Glocke im Turm schwingt danach)

  // --- Zeichen-Helfer ohne Array-Allokation ---
  function quad(ctx, x0, y0, x1, y1, x2, y2, x3, y3, fill, stroke = COLOR_INK, lw = 3) {
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); }
  }
  function tri(ctx, x0, y0, x1, y1, x2, y2, fill, stroke = COLOR_INK, lw = 3) {
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.lineTo(x2, y2); ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); }
  }
  // Pflasterstein 26×12 mit 1 px abgeschrägten Ecken (fillStyle vorher setzen)
  function stein(ctx, x, y) { ctx.fillRect(x + 1, y, 24, 12); ctx.fillRect(x, y + 1, 26, 10); }
  // Rundbogen (Tür, Kirchenfenster): (x, y) = linke obere Ecke des umschließenden Rechtecks
  function arch(ctx, x, y, w, h, fill, stroke = COLOR_INK, lw = 3) {
    const r = w / 2;
    ctx.beginPath(); ctx.moveTo(x, y + h); ctx.lineTo(x, y + r); ctx.arc(x + r, y + r, r, Math.PI, 0); ctx.lineTo(x + w, y + h); ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); }
  }

  /* ===== FERN: Pfarrkirche St. Rupert ===== */
  function kirche(ctx, cx, by, env) {
    const f = PAL.far;
    // Langhaus mit steilem Dach
    H.rect(ctx, cx - 120, by - 170, 290, 176, f.nave, COLOR_INK, 3);
    quad(ctx, cx - 134, by - 170, cx + 184, by - 170, cx + 140, by - 262, cx - 90, by - 262, f.naveRoof, COLOR_INK, 3);
    H.rect(ctx, cx + 60, by - 300, 14, 40, f.tower, COLOR_INK, 2.5);           // Dachreiter
    tri(ctx, cx + 56, by - 300, cx + 78, by - 300, cx + 67, by - 322, f.helm, COLOR_INK, 2.5);
    for (let k = 0; k < 4; k++) arch(ctx, cx - 92 + k * 64, by - 138, 26, 78, f.win, COLOR_INK, 2.5);
    arch(ctx, cx + 122, by - 60, 34, 66, '#5A3A1E', COLOR_INK, 3);            // Portal
    // Turm
    H.rect(ctx, cx - 200, by - 330, 78, 336, f.tower, COLOR_INK, 3);
    H.line(ctx, cx - 200, by - 202, cx - 122, by - 202, COLOR_INK, 2.5);      // Gesims
    arch(ctx, cx - 172, by - 120, 22, 50, f.win, COLOR_INK, 2.5);
    // Uhr (Minutenzeiger läuft mit)
    H.circle(ctx, cx - 161, by - 288, 22, '#FFFFFF', COLOR_INK, 3);
    for (let k = 0; k < 4; k++) { const a = k * Math.PI / 2; ctx.fillStyle = COLOR_INK; ctx.fillRect(cx - 162 + Math.sin(a) * 16, by - 289 - Math.cos(a) * 16, 3, 3); }
    const mh = env.t / 60 * Math.PI * 2, hh = mh / 12 + 5.2;
    H.line(ctx, cx - 161, by - 288, cx - 161 + Math.sin(hh) * 11, by - 288 - Math.cos(hh) * 11, COLOR_INK, 3.5);
    H.line(ctx, cx - 161, by - 288, cx - 161 + Math.sin(mh) * 16, by - 288 - Math.cos(mh) * 16, COLOR_INK, 2.5);
    // Schallfenster mit Glocke (schwingt nach dem Glockenschlag)
    arch(ctx, cx - 178, by - 260, 34, 46, '#3A3226', COLOR_INK, 2.5);
    const age = env.t - bellAt, sw = age < 4 ? Math.sin(age * 9) * 0.55 * (1 - age / 4) : 0;
    ctx.save(); ctx.translate(cx - 161, by - 254); ctx.rotate(sw);
    quad(ctx, -8, 0, -12, 22, 12, 22, 8, 0, COLOR_GOLD, COLOR_INK, 2.5);
    H.circle(ctx, 0, 24, 4, COLOR_INK, null);
    ctx.restore();
    // Zwiebel + Spitzhelm + Kreuz (Kreuzspitze bei y = 120, bleibt unter dem HUD)
    tri(ctx, cx - 204, by - 344, cx - 118, by - 344, cx - 161, by - 452, f.helm, COLOR_INK, 3);
    H.ellipse(ctx, cx - 161, by - 342, 46, 16, f.helm, COLOR_INK, 3);
    H.circle(ctx, cx - 161, by - 454, 5, COLOR_GOLD, COLOR_INK, 2.5);
    H.line(ctx, cx - 161, by - 458, cx - 161, by - 484, COLOR_GOLD, 4);
    H.line(ctx, cx - 171, by - 475, cx - 151, by - 475, COLOR_GOLD, 4);
  }

  /* ===== FERN: Schloss Stibichhofen (Museum) – Renaissance, Ecktürme, Walmdach ===== */
  function eckturm(ctx, x, by, env) {
    const f = PAL.far;
    H.rect(ctx, x, by - 236, 50, 242, f.castleTower, COLOR_INK, 3);
    tri(ctx, x - 6, by - 236, x + 56, by - 236, x + 25, by - 316, f.castleRoof, COLOR_INK, 3);
    H.circle(ctx, x + 25, by - 318, 4, COLOR_GOLD, COLOR_INK, 2);
    H.win(ctx, x + 16, by - 220, 18, 24, env.night);
    H.win(ctx, x + 16, by - 160, 18, 24, env.night);
  }
  function schloss(ctx, cx, by, env) {
    const f = PAL.far;
    eckturm(ctx, cx - 180, by, env); eckturm(ctx, cx + 130, by, env);
    H.rect(ctx, cx - 150, by - 190, 300, 196, f.castle, COLOR_INK, 3);
    quad(ctx, cx - 164, by - 190, cx + 164, by - 190, cx + 120, by - 256, cx - 120, by - 256, f.castleRoof, COLOR_INK, 3);
    H.rect(ctx, cx + 60, by - 280, 16, 30, f.castleTower, COLOR_INK, 2.5);     // Kamin
    H.line(ctx, cx - 150, by - 128, cx + 150, by - 128, COLOR_INK, 2.5);      // Gesimse
    H.line(ctx, cx - 150, by - 72, cx + 150, by - 72, COLOR_INK, 2.5);
    for (let r = 0; r < 3; r++) for (let k = 0; k < 5; k++) {
      if (r === 2 && k === 2) continue;                                          // hier sitzt das Portal
      H.win(ctx, cx - 126 + k * 56, by - 178 + r * 56, 20, 30, env.night);
    }
    arch(ctx, cx - 24, by - 62, 48, 68, '#5A3A1E', COLOR_INK, 3);            // Portal
    // Fahne und Museums-Transparent
    H.flag(ctx, cx - 40, by - 256, 64, COLOR_PRIMARY, env.t);
    H.rect(ctx, cx - 56, by - 246, 112, 26, '#FFFFFF', COLOR_INK, 3, 4);
    txt('Museum', cx, by - 233, T_MUSEUM);
  }

  /* ===== MITTE: Häuserzeile mit Rundgiebeln, Läden, Erkern, Schildern ===== */
  function rundgiebel(ctx, x, top, w, wall, roof) {
    const g = 28 + w * 0.12, r = w * 0.2;
    // Dachkante (Dachfarbe, leicht nach oben versetzt) …
    ctx.beginPath(); ctx.moveTo(x - 4, top - 6);
    ctx.quadraticCurveTo(x + w * 0.26, top - 6, x + w * 0.3, top - g - 6);
    ctx.arc(x + w / 2, top - g - 6, r, Math.PI, 0);
    ctx.quadraticCurveTo(x + w * 0.74, top - 6, x + w + 4, top - 6);
    ctx.lineTo(x + w + 4, top + 2); ctx.lineTo(x - 4, top + 2); ctx.closePath();
    ctx.fillStyle = roof; ctx.fill(); ctx.lineJoin = 'round'; ctx.lineWidth = 3; ctx.strokeStyle = COLOR_INK; ctx.stroke();
    // … darunter der Giebel in Wandfarbe
    ctx.beginPath(); ctx.moveTo(x, top);
    ctx.quadraticCurveTo(x + w * 0.27, top, x + w * 0.31, top - g);
    ctx.arc(x + w / 2, top - g, r - 3, Math.PI, 0);
    ctx.quadraticCurveTo(x + w * 0.73, top, x + w, top);
    ctx.lineTo(x + w, top + 4); ctx.lineTo(x, top + 4); ctx.closePath();
    ctx.fillStyle = wall; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = COLOR_INK; ctx.stroke();
    H.circle(ctx, x + w / 2, top - g - 2, 9, PAL.far.win, COLOR_INK, 2.5);    // Ochsenauge
    H.circle(ctx, x + w / 2, top - g - r - 8, 5, roof, COLOR_INK, 2.5);       // Knauf
  }
  function walmdach(ctx, x, top, w, roof, night) {
    quad(ctx, x - 8, top, x + w + 8, top, x + w - 36, top - 54, x + 36, top - 54, roof, COLOR_INK, 3);
    H.rect(ctx, x + w - 56, top - 66, 14, 24, '#6E6E6E', COLOR_INK, 2.5);     // Kamin
    H.rect(ctx, x + w / 2 - 12, top - 34, 24, 22, roof, COLOR_INK, 2.5);       // Gaube
    tri(ctx, x + w / 2 - 16, top - 34, x + w / 2 + 16, top - 34, x + w / 2, top - 48, roof, COLOR_INK, 2.5);
    H.win(ctx, x + w / 2 - 7, top - 30, 14, 14, night);
  }
  function dreieckgiebel(ctx, x, top, w, wall, roof) {
    tri(ctx, x - 8, top - 6, x + w + 8, top - 6, x + w / 2, top - 70, roof, COLOR_INK, 3);
    tri(ctx, x + 8, top, x + w - 8, top, x + w / 2, top - 54, wall, COLOR_INK, 3);
    H.circle(ctx, x + w / 2, top - 22, 8, PAL.far.win, COLOR_INK, 2.5);
  }
  function markise(ctx, ax, aw, by, color) {
    quad(ctx, ax, by - 64, ax + aw, by - 64, ax + aw + 6, by - 48, ax - 6, by - 48, color, COLOR_INK, 3);
    const n = Math.max(2, Math.floor(aw / 22)), sw = aw / n;
    ctx.fillStyle = '#FFFFFF';
    for (let k = 1; k < n; k += 2) ctx.fillRect(ax + k * sw, by - 63, sw, 14);
    H.line(ctx, ax - 6, by - 48, ax + aw + 6, by - 48, COLOR_INK, 3);
  }
  function haus(ctx, x, by, w, i, env) {
    const wall = PAL.wall[Math.floor(env.rnd(i, 11) * WALLS.length)];
    const roof = PAL.roof[Math.floor(env.rnd(i, 12) * ROOFS.length)];
    const shut = SHUTTERS[Math.floor(env.rnd(i, 13) * SHUTTERS.length)];
    const upper = env.rnd(i, 14) < 0.45 ? 1 : 2;                                 // Obergeschosse
    const eave = 88 + upper * 56 + Math.floor(env.rnd(i, 15) * 3) * 6;          // Traufhöhe
    const top = by - eave, g = env.rnd(i, 16), pitch = w / 3;
    const erker = env.rnd(i, 17) > 0.68, sg = env.rnd(i, 19), kisterl = env.rnd(i, 20) > 0.5, cat = env.rnd(i, 24) > 0.8;
    // Fassade
    H.rect(ctx, x, top, w, eave + 6, wall, COLOR_INK, 3);
    // Dach / Giebel
    if (g < 0.5) rundgiebel(ctx, x, top, w, wall, roof);
    else if (g < 0.8) walmdach(ctx, x, top, w, roof, env.night);
    else dreieckgiebel(ctx, x, top, w, wall, roof);
    // Gesims über dem Erdgeschoss
    H.line(ctx, x, by - 90, x + w, by - 90, COLOR_INK, 2);
    // Fenster der Obergeschosse mit Läden
    for (let f = 0; f < upper; f++) {
      const wy = by - 116 - f * 56;
      for (let k = 0; k < 3; k++) {
        if (erker && k === 1 && f === upper - 1) continue;
        const wx = x + pitch * (k + 0.5) - 10;
        H.rect(ctx, wx - 9, wy, 38, 28, shut, COLOR_INK, 2);      // beide Läden als ein Block, Fensterrahmen trennt sie
        H.win(ctx, wx, wy, 20, 28, env.night);
        if (kisterl) {
          H.rect(ctx, wx - 3, wy + 27, 26, 7, '#7A4B23', COLOR_INK, 2);
          for (let b = 0; b < 3; b++) H.circle(ctx, wx + 2 + b * 8, wy + 26, 3, FLOWERS[(i + b) % 5], COLOR_INK, 1.5);
        } else H.rect(ctx, wx - 3, wy + 28, 26, 4, '#FFFFFF', COLOR_INK, 2);
        if (cat && f === 0 && k === 2) katze(ctx, wx + 10, wy + 28, env.rnd(i, 25) > 0.5 ? '#E8923A' : '#8E97A8');
      }
    }
    // Erker im obersten Stock
    if (erker) {
      const ex = x + w / 2 - 24, ey = by - 132 - (upper - 1) * 56;
      H.rect(ctx, ex, ey, 48, 64, wall, COLOR_INK, 3);
      ctx.fillStyle = 'rgba(0,0,0,0.12)'; ctx.fillRect(ex + 40, ey + 2, 6, 60);
      tri(ctx, ex - 6, ey, ex + 54, ey, ex + 24, ey - 16, roof, COLOR_INK, 2.5);
      H.win(ctx, ex + 14, ey + 16, 20, 28, env.night);
      H.rect(ctx, ex + 11, ey + 44, 26, 4, '#FFFFFF', COLOR_INK, 2);
    }
    // Erdgeschoss: Tür, Schaufenster, Markise / Schild
    arch(ctx, x + 14, by - 60, 30, 70, '#7A4B23', COLOR_INK, 3);
    H.circle(ctx, x + 38, by - 28, 2.5, COLOR_GOLD, null);
    H.win(ctx, x + 56, by - 46, w - 68, 34, env.night);
    H.line(ctx, x + 56 + (w - 68) / 2, by - 46, x + 56 + (w - 68) / 2, by - 12, COLOR_INK, 2);
    if (sg < 0.5) {
      markise(ctx, x + 52, w - 60, by, AWNING[Math.floor(env.rnd(i, 21) * AWNING.length)]);
      H.rect(ctx, x + 52, by - 86, w - 60, 16, '#FFFFFF', COLOR_INK, 2.5, 3);
      txt(SIGNS[Math.floor(env.rnd(i, 22) * SIGNS.length)], x + 52 + (w - 60) / 2, by - 78, T_SIGN);
    } else if (sg < 0.8) {
      // Hängeschild am Ausleger
      H.line(ctx, x + w - 8, by - 88, x + w - 48, by - 88, COLOR_INK, 3);
      H.rect(ctx, x + w - 46, by - 86, 38, 22, '#FFFFFF', COLOR_INK, 2.5, 4);
      txt(HANG[Math.floor(env.rnd(i, 23) * HANG.length)], x + w - 27, by - 75, T_HANG);
    }
  }
  // Katze auf der Fensterbank (x, y) = Sitzpunkt
  function katze(ctx, x, y, color) {
    H.line(ctx, x + 12, y - 4, x + 22, y - 14, color, 4);                       // Schwanz
    H.ellipse(ctx, x, y - 7, 13, 7, color, COLOR_INK, 2.5);                    // Körper
    tri(ctx, x - 16, y - 14, x - 10, y - 24, x - 6, y - 15, color, COLOR_INK, 2); // Ohren
    tri(ctx, x - 6, y - 15, x - 2, y - 24, x + 2, y - 14, color, COLOR_INK, 2);
    H.circle(ctx, x - 8, y - 14, 7, color, COLOR_INK, 2.5);                    // Kopf
    H.circle(ctx, x - 10, y - 15, 1.5, COLOR_INK, null); H.circle(ctx, x - 5, y - 15, 1.5, COLOR_INK, null);
  }
  // Stadtbrunnen (Lücke in der Häuserzeile)
  function brunnen(ctx, x, by, env) {
    H.rect(ctx, x + 16, by - 30, 148, 34, '#B9B3A6', COLOR_INK, 3, 4);
    H.rect(ctx, x + 10, by - 36, 160, 10, '#9A958D', COLOR_INK, 3, 3);
    H.rect(ctx, x + 84, by - 96, 12, 62, '#9A958D', COLOR_INK, 3);
    H.ellipse(ctx, x + 90, by - 96, 30, 8, '#B9B3A6', COLOR_INK, 3);
    H.circle(ctx, x + 90, by - 110, 8, COLOR_GOLD, COLOR_INK, 2.5);
    // Wasserstrahlen (bewegte Tropfen)
    ctx.fillStyle = COLOR_WATER;
    for (let s = -1; s <= 1; s += 2) for (let k = 0; k < 5; k++) {
      const u = (k / 5 + env.t * 0.7) % 1;
      ctx.fillRect(x + 90 + s * (14 + u * 36) - 2, by - 100 + u * u * 66 - 2, 5, 5);
    }
    ctx.fillStyle = WATER_70; ctx.fillRect(x + 22, by - 28, 136, 8);
  }

  /* ===== NAH: Laternen, Wimpelketten, Litfaßsäule ===== */
  function laterne(ctx, x, by, night, sign) {
    H.rect(ctx, x - 11, by - 14, 22, 16, '#2E3A2F', COLOR_INK, 3, 3);
    H.rect(ctx, x - 4, by - 160, 8, 148, '#2E3A2F', COLOR_INK, 3);
    H.rect(ctx, x - 8, by - 170, 16, 12, '#2E3A2F', COLOR_INK, 2.5);
    quad(ctx, x - 12, by - 172, x + 12, by - 172, x + 17, by - 206, x - 17, by - 206, night > 0.3 ? '#FFE27A' : '#DDE8F0', COLOR_INK, 3);
    tri(ctx, x - 22, by - 206, x + 22, by - 206, x, by - 226, '#2E3A2F', COLOR_INK, 3);
    H.circle(ctx, x, by - 228, 4, '#2E3A2F', COLOR_INK, 2);
    if (night > 0.3) { ctx.save(); ctx.globalAlpha = 0.25 * night; H.circle(ctx, x, by - 190, 64, '#FFE27A', null); ctx.restore(); }
    if (!sign) return;
    H.rect(ctx, x + 6, by - 118, 74, 18, '#FFFFFF', COLOR_INK, 2.5, 3);        // Straßenschild
    txt('Hauptplatz', x + 43, by - 109, T_STREET);
  }
  function wimpel(ctx, x0, y0, x1, y1, sag, k0) {
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2 + sag;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo(cx, cy, x1, y1);
    ctx.lineWidth = 2.5; ctx.strokeStyle = COLOR_INK; ctx.stroke();
    for (let k = 0; k < 11; k++) {
      const t = (k + 0.5) / 11, a = (1 - t) * (1 - t), b = 2 * (1 - t) * t, c = t * t;
      const px = a * x0 + b * cx + c * x1, py = a * y0 + b * cy + c * y1;
      tri(ctx, px - 7, py, px + 7, py, px, py + 17, BUNT[(k + k0) & 3], COLOR_INK, 2);
    }
  }
  function litfass(ctx, x, by) {
    H.rect(ctx, x - 22, by - 150, 44, 152, '#8A8F8A', COLOR_INK, 3, 4);
    H.ellipse(ctx, x, by - 152, 27, 8, '#5A5F5A', COLOR_INK, 3);
    H.circle(ctx, x, by - 160, 5, '#5A5F5A', COLOR_INK, 2.5);
    H.rect(ctx, x - 16, by - 140, 32, 46, COLOR_PRIMARY, COLOR_INK, 2);
    txt('FEST', x, by - 122, T_FEST);
    H.star(ctx, x, by - 105, 8, COLOR_GOLD);
    H.rect(ctx, x - 16, by - 86, 32, 40, '#FFFFFF', COLOR_INK, 2);
    H.heart(ctx, x, by - 66, 22, COLOR_KORTSCHAK);
    H.rect(ctx, x - 16, by - 40, 32, 24, '#5CC8FF', COLOR_INK, 2);
  }

  /* ===== Hindernis-Bausteine ===== */
  function rad(ctx, x, y, r, t) {
    H.circle(ctx, x, y, r, '#2F2F2F', COLOR_INK, 3);
    H.circle(ctx, x, y, r * 0.5, '#C9C9C9', COLOR_INK, 2.5);
    ctx.save(); ctx.translate(x, y); ctx.rotate(-t * 9); H.line(ctx, -r * 0.45, 0, r * 0.45, 0, COLOR_INK, 2.5); ctx.restore();
  }
  function buerste(ctx, x, y, r, t) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(-t * 14);
    for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4; H.line(ctx, 0, 0, Math.cos(a) * r, Math.sin(a) * r, '#F2C94C', 3.5); }
    ctx.restore();

    H.poly(ctx, [bx - 30, 396, bx + 30, 396, bx + 48, Y_WATER + 2, bx - 48, Y_WATER + 2], P.water, COLOR_INK, 3);
    ctx.save(); ctx.globalAlpha = 0.7 * P.foam; ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    for (let k = 0; k < 3; k++) { const y = 420 + k * 30 + ((env.t * 40 + k * 17) % 30); H.line(ctx, bx - 8, y, bx + 8, y - 4, '#FFFFFF', 2.5); }
    ctx.restore();
    H.bush(ctx, bx - 34, 402, 40, P.bush); H.bush(ctx, bx + 36, 400, 44, P.bush);
    // Bogenbrücke
    const y0 = 482, cy = 438;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(bx - 74, y0); ctx.quadraticCurveTo(bx, cy, bx + 74, y0);
    ctx.lineWidth = 15; ctx.strokeStyle = COLOR_INK; ctx.stroke();
    ctx.lineWidth = 9; ctx.strokeStyle = C_WOOD; ctx.stroke();
    // Geländerpfosten + Handlauf
    for (let k = 0; k <= 4; k++) {
      const u = k / 4, x = bx - 74 + u * 148, y = (1 - u) * (1 - u) * y0 + 2 * (1 - u) * u * cy + u * u * y0;
      H.line(ctx, x, y - 2, x, y - 26, COLOR_INK, 6); H.line(ctx, x, y - 2, x, y - 26, C_WOOD_D, 3);
    }
    ctx.beginPath(); ctx.moveTo(bx - 74, y0 - 26); ctx.quadraticCurveTo(bx, cy - 26, bx + 74, y0 - 26);
    ctx.lineWidth = 6; ctx.strokeStyle = COLOR_INK; ctx.stroke();
    ctx.lineWidth = 3; ctx.strokeStyle = C_WOOD; ctx.stroke();
  }
  // Almhütte am Waldrand mit Rauch
  function huette(ctx, x, baseY, env) {
    H.rect(ctx, x + 14, baseY - 72, 10, 22, '#6E6E6E', COLOR_INK, 2.5);
    H.rect(ctx, x - 34, baseY - 40, 68, 40, '#8C5A2B', COLOR_INK, 3);
    H.tri(ctx, x - 44, baseY - 40, x + 44, baseY - 40, x, baseY - 76, '#5A3A1E', COLOR_INK, 3);
    H.win(ctx, x - 12, baseY - 30, 18, 14, env.night);
    H.rect(ctx, x + 10, baseY - 26, 14, 26, '#4A2E14', COLOR_INK, 2.5);
    ctx.save();
    for (let k = 0; k < 3; k++) {
      const u = (env.t * 0.3 + k * 0.33) % 1;
      ctx.globalAlpha = (1 - u) * 0.55;
      H.circle(ctx, x + 19 + Math.sin(u * 5 + k) * 7, baseY - 78 - u * 44, 4 + u * 8, '#FFFFFF', null);
    }
    ctx.restore();
  }
  // Ente: (x, y) = Fußpunkt. Sitzt nach links schauend, fliegt nach rechts.
  function ente(ctx, x, y, erpel, flying, ph) {
    const body = erpel ? C_DUCK_M : C_DUCK_F, dark = erpel ? C_DUCK_MD : C_DUCK_FD, head = erpel ? C_HEAD_M : C_HEAD_F;
    ctx.save(); ctx.translate(x, y);
    if (flying) { ctx.scale(-1, 1); ctx.rotate(0.22); }
    if (flying) { ctx.save(); ctx.translate(4, -16); ctx.rotate(-0.5 + Math.sin(ph) * 0.9); H.ellipse(ctx, 0, -12, 7, 14, dark, COLOR_INK, 2.5); ctx.restore(); }
    H.tri(ctx, 14, -14, 27, -23, 16, -8, body, COLOR_INK, 2.5);
    H.ellipse(ctx, 0, -12, 18, 11, body, COLOR_INK, 3);
    if (!flying) H.ellipse(ctx, 4, -12, 11, 6, dark, COLOR_INK, 2.5);
    else { H.line(ctx, -4, -2, -8, 4, C_BILL, 3); H.line(ctx, 4, -2, 2, 5, C_BILL, 3); }
    H.circle(ctx, -15, -25, 9, head, COLOR_INK, 3);
    if (erpel) H.line(ctx, -9, -18, -3, -15, '#FFFFFF', 3);
    H.poly(ctx, [-23, -27, -36, -22, -23, -18], C_BILL, COLOR_INK, 2.5);
    H.circle(ctx, -17, -27, 2.2, COLOR_INK, null);
    if (flying) { ctx.save(); ctx.translate(0, -14); ctx.rotate(0.6 - Math.sin(ph) * 0.9); H.ellipse(ctx, 0, -12, 7, 14, body, COLOR_INK, 2.5); ctx.restore(); }
    else { H.line(ctx, -5, -2, -11, 1, C_BILL, 3); H.line(ctx, 5, -2, 11, 1, C_BILL, 3); }
    ctx.restore();
  }
  // Papierschiffchen – treibt mit der Strömung, schaukelt
  function schiffchen(ctx, x, y, t) {
    const b = Math.sin(t * 2.4 + x * 0.01) * 2;
    ctx.save(); ctx.translate(x, y + b); ctx.rotate(Math.sin(t * 2.4 + x * 0.01) * 0.08);
    H.poly(ctx, [-16, 0, 16, 0, 22, -8, -22, -8], '#FFFFFF', COLOR_INK, 2.5);
    H.tri(ctx, -8, -8, 8, -8, 0, -22, '#FFFFFF', COLOR_INK, 2.5);
    H.line(ctx, -14, -3, 14, -3, COLOR_PRIMARY, 2.5);
    ctx.restore();
    ctx.save(); ctx.globalAlpha = 0.7 * P.foam; H.line(ctx, x + 18, y + 4, x + 34, y + 3, '#FFFFFF', 2.5); ctx.restore();
  }
  // Fliegenpilz (Deko auf dem Stamm)
  function pilz(ctx, x, baseY, s) {
    H.rect(ctx, x - 4 * s, baseY - 10 * s, 8 * s, 10 * s, '#FFF6E0', COLOR_INK, 2.5, 2);
    ctx.beginPath(); ctx.arc(x, baseY - 10 * s, 10 * s, Math.PI, 0); ctx.closePath();
    ctx.fillStyle = '#D9412B'; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = COLOR_INK; ctx.lineJoin = 'round'; ctx.stroke();
    H.circle(ctx, x - 4 * s, baseY - 14 * s, 1.8 * s, '#FFFFFF', null); H.circle(ctx, x + 3 * s, baseY - 16 * s, 1.5 * s, '#FFFFFF', null);
  }

  registerSection({
    id: 'bach', name: 'Vordernbergerbach', banner: 'Vordernbergerbach!', bannerColor: COLOR_WATER,
    lengthM: 180, minLevel: 1, weight: 1,
    ground: { top: '#6BBF3A', mid: '#CFC3A4', body: '#8C6B45' },
    items: ['shirt', 'cap'],
    gaps: true, itemsOnStones: true,

    // Ferne: bewaldeter Rücken mit Fichten, ab und zu eine Hütte
    drawFar(ctx, env) {
      mix(env);
      const s = env.scroll;
      ctx.beginPath(); ctx.moveTo(-20, 620);
      for (let x = -20; x <= env.W + 40; x += 24) ctx.lineTo(x, ridgeY(x + s));
      ctx.lineTo(env.W + 40, 620); ctx.closePath();
      ctx.fillStyle = P.ridge; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = COLOR_INK; ctx.lineJoin = 'round'; ctx.stroke();
      // hintere Fichtenreihe, davor die Hütte, davor die niedrigere vordere Reihe (weicht der Hütte aus)
      env.tile(92, (sx, i) => {
        const x = sx + env.rnd(i, 61) * 60;
        H.pine(ctx, x, ridgeY(x + s) + 12, 56 + env.rnd(i, 62) * 44, i & 1 ? P.pine : P.pine2);
      });
      env.tile(HUT_T, (sx, i) => { const x = hutWX(i) - s; huette(ctx, x, ridgeY(x + s) + 26, env); });
      env.tile(74, (sx, i) => {
        const x = sx + env.rnd(i, 63) * 50;
        if (nearHut(x + s)) return;
        H.pine(ctx, x, ridgeY(x + s) + 50, 44 + env.rnd(i, 64) * 30, P.pine);
      });
    },

    // Mitte: Gegenufer mit Weiden/Erlen/Schilf, Steg oder Brücke, das Wasserband mit Wellen und Steinen
    drawMid(ctx, env) {
      mix(env);
      const s = env.scroll, t = env.t;
      // Uferwiese gegenüber
      ctx.fillStyle = P.bank; ctx.fillRect(-20, Y_BANK, env.W + 40, Y_GRAVEL - Y_BANK + 4);
      H.line(ctx, -20, Y_BANK, env.W + 40, Y_BANK, COLOR_INK, 3, 'butt');
      // Steg oder Seitenbach mit Brücke (Seitenbach muss vor den Bäumen liegen)
      env.tile(1500, (sx, i) => { if (env.rnd(i, 70) >= 0.5) bruecke(ctx, sx + 300 + env.rnd(i, 71) * 700, env); });
      env.tile(760, (sx, i) => {
        const x = sx + 60 + env.rnd(i, 72) * 220;
        if (env.rnd(i, 73) < 0.55) weide(ctx, x, Y_GRAVEL - 2, 150 + env.rnd(i, 74) * 40, t);
        else H.tree(ctx, x, Y_GRAVEL - 2, 120 + env.rnd(i, 74) * 40, P.erle, '#5A3A1E');
        H.bush(ctx, sx + 400 + env.rnd(i, 75) * 140, Y_GRAVEL + 2, 34 + env.rnd(i, 76) * 22, P.bush);
        schilf(ctx, sx + 580 + env.rnd(i, 77) * 120, Y_GRAVEL + 2, 0.8, t, i);
      });
      // Kies + Wasser
      ctx.fillStyle = P.gravel; ctx.fillRect(-20, Y_GRAVEL, env.W + 40, Y_WATER - Y_GRAVEL);
      ctx.fillStyle = P.water; ctx.fillRect(-20, Y_WATER, env.W + 40, 92);
      ctx.fillStyle = P.waterD; ctx.fillRect(-20, Y_DEEP, env.W + 40, 46);
      ctx.fillStyle = P.shallow; ctx.fillRect(-20, Y_WATER, env.W + 40, 9);
      H.line(ctx, -20, Y_WATER, env.W + 40, Y_WATER, COLOR_INK, 3, 'butt');
      // Wellen: kurze, wandernde Bögen
      ctx.save(); ctx.globalAlpha = 0.85 * P.foam; ctx.strokeStyle = '#DFF4FF'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      env.tile(120, (sx, i) => {
        const x = sx + env.rnd(i, 80) * 70 + ((t * 26 + i * 13) % 50), y = 524 + env.rnd(i, 81) * 60, w = 22 + env.rnd(i, 82) * 22;
        ctx.beginPath();
        for (let k = 0; k <= 4; k++) ctx.lineTo(x + k * w / 4, y + (k & 1 ? -2.5 : 2.5) + Math.sin(t * 3 + i + k) * 1.2);
        ctx.stroke();
      });
      ctx.restore();
      // Glitzer
      ctx.save(); ctx.fillStyle = '#FFFFFF';
      env.tile(150, (sx, i) => {
        ctx.globalAlpha = Math.max(0, 0.25 + 0.45 * Math.sin(t * 3.2 + i * 1.7)) * P.foam;
        ctx.fillRect(sx + env.rnd(i, 83) * 100, 520 + env.rnd(i, 84) * 64, 12, 3);
      });
      ctx.restore();
      // Mondstraße auf dem Wasser
      if (env.moon > 0.02) {
        ctx.save(); ctx.fillStyle = '#F4F1D8';
        const mx = env.W * 0.78;
        for (let k = 0; k < 6; k++) {
          ctx.globalAlpha = env.moon * 0.45;
          const w = 26 + k * 9;
          ctx.fillRect(mx - w / 2 + Math.sin(t * 1.5 + k * 1.3) * 9, 522 + k * 12, w, 3);
        }
        ctx.restore();
      }
      // Steine im Bach
      env.tile(330, (sx, i) => {
        if (env.rnd(i, 85) < 0.3) return;
        bachstein(ctx, sx + env.rnd(i, 86) * 200, 548 + env.rnd(i, 87) * 26, 12 + env.rnd(i, 88) * 12, t);
      });
      // Papierschiffchen, alle ~900 px eines, treibt nach links (bachabwärts)
      env.tile(900, (sx, i) => { if (env.rnd(i, 89) < 0.4) return; schiffchen(ctx, sx + 860 - ((t * 28 + i * 230) % 900), 546 + env.rnd(i, 79) * 20, t); });
      // Holzsteg (dort, wo keine Brücke ist)
      env.tile(1500, (sx, i) => { if (env.rnd(i, 70) < 0.5) steg(ctx, sx + 200 + env.rnd(i, 71) * 800, env); });
      // Nahes Ufer: Kiesstreifen bis zum Weg
      ctx.fillStyle = P.gravel; ctx.fillRect(-20, Y_SHORE, env.W + 40, 16);
      H.line(ctx, -20, Y_SHORE, env.W + 40, Y_SHORE, COLOR_INK, 3, 'butt');
    },

    // Nah: Schilf, Uferbüsche, Erlen, Kiesel – nachts Glühwürmchen
    drawNear(ctx, env) {
      mix(env);
      env.tile(440, (sx, i) => {
        const r = env.rnd(i, 90);
        schilf(ctx, sx + env.rnd(i, 91) * 160, env.groundY + 4, 1.15, env.t, i + 7);
        if (r < 0.4) H.bush(ctx, sx + 220 + env.rnd(i, 92) * 100, env.groundY + 4, 52 + env.rnd(i, 93) * 30, P.bush);
        else if (r < 0.65) H.tree(ctx, sx + 260 + env.rnd(i, 92) * 80, env.groundY + 4, 190 + env.rnd(i, 93) * 50, P.erle, '#5A3A1E');
        for (let k = 0; k < 3; k++) H.ellipse(ctx, sx + 330 + env.rnd(i, 94) * 60 + k * 15, env.groundY + 1, 7 - k, 4, k & 1 ? '#B9B3A3' : '#D6D0C2', COLOR_INK, 2);
      });
      if (env.night > 0.15) {
        ctx.save();
        env.tile(190, (sx, i) => {
          const a = env.night * (0.35 + 0.65 * Math.max(0, Math.sin(env.t * 2.2 + i * 2.3)));
          ctx.globalAlpha = a;
          const x = sx + env.rnd(i, 95) * 150, y = 480 + env.rnd(i, 96) * 100 + Math.sin(env.t * 1.3 + i) * 8;
          ctx.globalAlpha = a * 0.3; H.circle(ctx, x, y, 9, '#FFF08A', null);   // weicher Schein
          ctx.globalAlpha = a; H.circle(ctx, x, y, 3.5, '#FFF8C0', null);
        });
        ctx.restore();
      }
    },

    // Boden: Grasbüschel auf dem Rasenstreifen, Kiesel auf dem Weg
    drawGround(ctx, env, sx0, sx1) {
      ctx.strokeStyle = '#3F8F2E'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      env.tile(58, (sx, i) => {
        const x = sx + env.rnd(i, 100) * 40;
        ctx.beginPath(); ctx.moveTo(x, env.groundY + 13); ctx.lineTo(x - 4, env.groundY + 3); ctx.moveTo(x + 5, env.groundY + 13); ctx.lineTo(x + 9, env.groundY + 4); ctx.stroke();
      });
      env.tile(52, (sx, i) => {
        const x = sx + env.rnd(i, 101) * 40, y = env.groundY + 20 + env.rnd(i, 102) * 20, r = env.rnd(i, 103);
        if (r < 0.18) H.ellipse(ctx, x, y, 7, 4, '#A39A80', COLOR_INK, 1.5);
        else H.ellipse(ctx, x, y, 4 + r * 3, 2.5, i & 1 ? '#B9AD8E' : '#E4DBBF', null);
      });
    },

    obstacles: [

          H.rect(ctx, 10, -84, 32, 48, '#6B8E3A', COLOR_INK, 3, 9);
          H.line(ctx, 30, -70, 52, -60, COLOR_INK, 11); H.line(ctx, 30, -70, 52, -60, '#6B8E3A', 6);
          H.circle(ctx, 53, -60, 5, COLOR_SKIN, COLOR_INK, 2.5);
          const tipX = 128, tipY = -132 + Math.sin(t * 1.7) * 3, bob = Math.sin(t * 2.3) * 3;

          H.line(ctx, tipX, tipY, tipX + 4, -46 + bob, COLOR_INK, 1.5);

    H.rect(ctx, x - 2, y - 76, 40, 7, COLOR_INK, COLOR_INK, 2, 2);                             // Dach
    if (night > 0.3) { ctx.save(); ctx.globalAlpha = 0.25 * night; quad(ctx, x + 94, y - 46, x + 190, y - 62, x + 190, y - 18, x + 94, y - 34, LAMP, null); ctx.restore(); }
    H.circle(ctx, x + 94, y - 40, 4, night > 0.3 ? LAMP : '#FFF3B0', COLOR_INK, 2);           // Laterne
    ctx.save();   // Dampf zieht nach hinten
    for (let k = 0; k < 3; k++) { const p = (t * 0.9 + k / 3) % 1; ctx.globalAlpha = 0.75 * (1 - p); H.circle(ctx, x + 68 - p * 46, y - 90 - p * 44, 6 + p * 12, night > 0.5 ? SMOKE_N : '#FFFFFF', null); }
    ctx.restore();
  }

  /* ---------- Mitte: Werksgelände ---------- */
  function rauch(ctx, x, y, t, night, drift) {   // drei Rauchwölkchen, driften mit der Fahrt nach hinten
    ctx.save();
    for (let k = 0; k < 3; k++) { const p = (t * 0.7 + k / 3) % 1; ctx.globalAlpha = 0.6 * (1 - p); H.circle(ctx, x + p * drift, y - p * 50, 6 + p * 12, night > 0.5 ? SMOKE_N : SMOKE, null); }
    ctx.restore();
  }
  function werkshalle(ctx, x, baseY, night, t) {   // 300 px breit, Sheddach, Tor, Fenster, Kamin
    H.rect(ctx, x, baseY - 120, 300, 120, WALL, COLOR_INK, 3);
    for (let k = 0; k < 3; k++) H.tri(ctx, x + k * 100, baseY - 120, x + k * 100 + 100, baseY - 120, x + k * 100 + 34, baseY - 164, ROOF, COLOR_INK, 3);
    ctx.beginPath(); for (let k = 0; k < 3; k++) { ctx.moveTo(x + k * 100 + 10, baseY - 130); ctx.lineTo(x + k * 100 + 30, baseY - 156); }   // Glasfronten
    ctx.lineCap = 'butt'; ctx.lineWidth = 6; ctx.strokeStyle = night > 0.3 ? LAMP : '#BFE9FF'; ctx.stroke();
    H.rect(ctx, x + 18, baseY - 76, 74, 76, STEEL_DARK, COLOR_INK, 3);                        // Rolltor
    ctx.beginPath(); for (let k = 0; k < 4; k++) { ctx.moveTo(x + 22, baseY - 62 + k * 16); ctx.lineTo(x + 88, baseY - 62 + k * 16); }
    ctx.lineWidth = 2; ctx.strokeStyle = STEEL; ctx.stroke();
    for (let k = 0; k < 3; k++) H.win(ctx, x + 118 + k * 44, baseY - 100, 30, 24, night);
    txt('GLÜCK AUF', x + 180, baseY - 40, T_HALLE);
    H.rect(ctx, x + 262, baseY - 230, 26, 112, '#B04A3A', COLOR_INK, 3);                       // Kamin
    H.rect(ctx, x + 262, baseY - 200, 26, 12, '#FFFFFF', null); H.rect(ctx, x + 262, baseY - 170, 26, 12, '#FFFFFF', null);
    H.rect(ctx, x + 258, baseY - 237, 34, 8, STEEL_DARK, COLOR_INK, 2.5);
    rauch(ctx, x + 275, baseY - 245, t, night, 40);
  }
  function seilscheibe(ctx, cx, cy, r, ang) {
    H.circle(ctx, cx, cy, r, STEEL_LIGHT, COLOR_INK, 3);
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang);
    H.line(ctx, -r + 2, 0, r - 2, 0, COLOR_INK, 3); H.line(ctx, 0, -r + 2, 0, r - 2, COLOR_INK, 3);
    ctx.rotate(Math.PI / 4); H.line(ctx, -r + 2, 0, r - 2, 0, COLOR_INK, 2); H.line(ctx, 0, -r + 2, 0, r - 2, COLOR_INK, 2);
    ctx.restore();
    H.circle(ctx, cx, cy, 4, STEEL_DARK, COLOR_INK, 2);
  }
  function foerderturm(ctx, x, baseY, t, night) {   // Stahlgerüst mit Seilscheiben, Schachthalle, Maschinenhaus
    const top = baseY - 300, y0 = baseY - 96, y1 = top + 34;
    H.rect(ctx, x - 62, baseY - 64, 124, 64, WALL, COLOR_INK, 3);                              // Schachthalle
    H.tri(ctx, x - 70, baseY - 64, x + 70, baseY - 64, x, baseY - 96, ROOF, COLOR_INK, 3);
    H.rect(ctx, x - 16, baseY - 40, 32, 40, STEEL_DARK, COLOR_INK, 3);
    H.win(ctx, x - 50, baseY - 50, 18, 16, night); H.win(ctx, x + 32, baseY - 50, 18, 16, night);
    H.rect(ctx, x + 96, baseY - 46, 60, 46, WALL, COLOR_INK, 3);                               // Maschinenhaus
    H.rect(ctx, x + 92, baseY - 56, 68, 12, ROOF, COLOR_INK, 3, 2); H.win(ctx, x + 114, baseY - 36, 22, 16, night);
    ctx.lineCap = 'butt';
    for (let pass = 0; pass < 2; pass++) {   // Schrägstrebe + Beine: erst Ink, dann Stahl – je ein Pfad
      ctx.beginPath(); ctx.moveTo(x + 86, baseY); ctx.lineTo(x + 22, y1 + 4);
      ctx.moveTo(x - 34, y0); ctx.lineTo(x - 18, y1); ctx.moveTo(x + 34, y0); ctx.lineTo(x + 18, y1);
      ctx.lineWidth = pass ? 5 : 9; ctx.strokeStyle = pass ? STEEL : COLOR_INK; ctx.stroke();
    }
    ctx.beginPath();
    for (let k = 0; k < 5; k++) {   // Riegel + X
      const u0 = k / 5, u1 = (k + 1) / 5, ya = y0 + (y1 - y0) * u0, yb = y0 + (y1 - y0) * u1, wa = 34 - 16 * u0, wb = 34 - 16 * u1;
      ctx.moveTo(x - wa, ya); ctx.lineTo(x + wa, ya);
      ctx.moveTo(x - wa, ya); ctx.lineTo(x + wb, yb); ctx.moveTo(x + wa, ya); ctx.lineTo(x - wb, yb);
    }
    ctx.lineWidth = 2.5; ctx.strokeStyle = COLOR_INK; ctx.stroke();
    H.rect(ctx, x - 30, top + 30, 60, 8, STEEL_DARK, COLOR_INK, 3);                            // Seilscheibenbühne
    H.rect(ctx, x - 32, top + 10, 5, 22, STEEL_DARK, COLOR_INK, 2); H.rect(ctx, x + 27, top + 10, 5, 22, STEEL_DARK, COLOR_INK, 2);
    H.rect(ctx, x - 38, top, 76, 10, ROOF, COLOR_INK, 3, 2);                                   // Dachl
    H.line(ctx, x - 12, top + 35, x - 12, baseY - 96, COLOR_INK, 2, 'butt');                   // Seil in den Schacht
    H.line(ctx, x + 24, top + 24, x + 122, baseY - 40, COLOR_INK, 2, 'butt');                  // Seil zum Maschinenhaus
    seilscheibe(ctx, x - 12, top + 20, 15, t * 1.4); seilscheibe(ctx, x + 12, top + 20, 15, t * 1.4);
    const on = night > 0.3 && Math.sin(t * 4) > 0;                                             // rotes Warnlicht
    if (on) { ctx.save(); ctx.globalAlpha = 0.45; H.circle(ctx, x, top - 5, 12, '#FF3B3B', null); ctx.restore(); }
    H.circle(ctx, x, top - 5, 5, on ? '#FF3B3B' : '#8B2020', COLOR_INK, 2);
  }
  function halde(ctx, x, baseY, r, h) {   // Abraumhalde (grau-braun) mit Erzflecken
    hump(ctx, x, baseY, r, h, ABRAUM, COLOR_INK);
    ctx.fillStyle = ABRAUM_DARK;
    for (let k = 0; k < 6; k++) { const u = (k + 0.5) / 6; ctx.fillRect(x - r * 0.7 + r * 1.4 * u, baseY - h * (0.2 + 0.55 * Math.abs(Math.sin(k * 2.3))), 7, 5); }
    ctx.fillStyle = RUST_LIGHT;
    for (let k = 0; k < 3; k++) ctx.fillRect(x - r * 0.4 + r * 0.4 * k, baseY - h * (0.35 + 0.2 * k), 6, 4);
  }
  // Förderband vom Haldenkopf (x0, y0) hinunter zum Boden (x1, y1)
  function foerderband(ctx, x0, y0, x1, y1) {
    const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy), a = Math.atan2(dy, dx);
    for (let k = 1; k <= 2; k++) { const u = k / 3, px = x0 + dx * u, py = y0 + dy * u; H.rect(ctx, px - 3, py - 6, 6, y1 - py + 6, STEEL_DARK, COLOR_INK, 2.5); }
    ctx.save(); ctx.translate(x0, y0); ctx.rotate(a);
    H.rect(ctx, -14, -14, L + 20, 14, STEEL_DARK, COLOR_INK, 3, 4);
    ctx.fillStyle = STEEL_LIGHT;
    for (let px = -8; px < L + 2; px += 18) ctx.fillRect(px, -11, 8, 8);   // Rollen
    ctx.restore();
  }
  function silo(ctx, x, baseY, night) {   // Erzsilo auf Stelzen mit Trichter
    for (let k = 0; k < 2; k++) H.rect(ctx, x + 4 + k * 78, baseY - 80, 8, 80, STEEL_DARK, COLOR_INK, 3);
    hump(ctx, x + 46, baseY, 32, 22, RUST, COLOR_INK);
    quad(ctx, x - 4, baseY - 84, x + 96, baseY - 84, x + 60, baseY - 44, x + 32, baseY - 44, STEEL, COLOR_INK, 3);   // Trichter
    H.rect(ctx, x - 4, baseY - 190, 100, 108, STEEL_LIGHT, COLOR_INK, 3, 4);
    H.rect(ctx, x - 4, baseY - 150, 100, 10, RUST_LIGHT, null); H.rect(ctx, x - 4, baseY - 110, 100, 10, RUST_LIGHT, null);
    H.tri(ctx, x - 10, baseY - 190, x + 102, baseY - 190, x + 46, baseY - 214, ROOF, COLOR_INK, 3);
    txt('ERZ', x + 46, baseY - 130, T_SILO);
    ctx.beginPath();   // Leiter – ein Pfad
    for (let k = 0; k < 6; k++) { ctx.moveTo(x + 84, baseY - 178 + k * 16); ctx.lineTo(x + 96, baseY - 178 + k * 16); }
    ctx.moveTo(x + 84, baseY - 184); ctx.lineTo(x + 84, baseY - 90); ctx.moveTo(x + 96, baseY - 184); ctx.lineTo(x + 96, baseY - 90);
    ctx.lineCap = 'butt'; ctx.lineWidth = 2.5; ctx.strokeStyle = STEEL_DARK; ctx.stroke();
  }

  /* ---------- Nah: Zaun, kleine Halde, Grubenlampe, Bergbau-Schild ---------- */
  function zaun(ctx, x, baseY) {
    for (let k = 0; k < 3; k++) H.rect(ctx, x + k * 50 - 3, baseY - 58, 6, 58, STEEL_DARK, COLOR_INK, 2.5);
    H.line(ctx, x - 3, baseY - 48, x + 103, baseY - 48, STEEL, 4, 'butt'); H.line(ctx, x - 3, baseY - 26, x + 103, baseY - 26, STEEL, 4, 'butt');
  }
  function grubenlampe(ctx, x, baseY, night) {
    H.rect(ctx, x - 4, baseY - 150, 8, 150, STEEL_DARK, COLOR_INK, 3);
    H.line(ctx, x, baseY - 148, x + 26, baseY - 158, COLOR_INK, 5);
    H.rect(ctx, x + 16, baseY - 182, 22, 26, night > 0.3 ? LAMP : '#DDE8F0', COLOR_INK, 3, 4);
    H.tri(ctx, x + 12, baseY - 182, x + 42, baseY - 182, x + 27, baseY - 194, STEEL_DARK);
    if (night > 0.3) { ctx.save(); ctx.globalAlpha = 0.25 * night; H.circle(ctx, x + 27, baseY - 166, 60, LAMP, null); ctx.restore(); }
  }
  function schild(ctx, x, baseY) {   // Schlägel und Eisen – das Bergbau-Zeichen
    H.rect(ctx, x - 4, baseY - 120, 8, 120, '#7A4B23', COLOR_INK, 3);
    H.circle(ctx, x, baseY - 140, 30, '#FFFFFF', COLOR_INK, 3);
    H.circle(ctx, x, baseY - 140, 24, null, RUST, 3);
    ctx.save(); ctx.translate(x, baseY - 140);
    ctx.rotate(-Math.PI / 4); H.rect(ctx, -3, -14, 6, 30, '#7A4B23', COLOR_INK, 2); H.rect(ctx, -8, -20, 16, 8, STEEL_DARK, COLOR_INK, 2);
    ctx.rotate(Math.PI / 2); H.rect(ctx, -3, -14, 6, 30, '#7A4B23', COLOR_INK, 2); H.tri(ctx, -8, -14, 8, -14, 0, -24, STEEL_DARK, COLOR_INK, 2);
    ctx.restore();
  }

  /* ---------- Hindernis-Helfer ---------- */
  // Grubenwagen (Lore) auf Schienenstück, x = linke Kante, w = Breite, Ursprung am Boden
  function lore(ctx, x, w) {
    H.rect(ctx, x, -4, w, 4, STEEL_DARK, COLOR_INK, 2);
    H.circle(ctx, x + 16, -13, 9, STEEL_DARK, COLOR_INK, 2.5); H.circle(ctx, x + 16, -13, 3, STEEL_LIGHT, null);
    H.circle(ctx, x + w - 16, -13, 9, STEEL_DARK, COLOR_INK, 2.5); H.circle(ctx, x + w - 16, -13, 3, STEEL_LIGHT, null);
    for (let k = 0; k < 4; k++) H.circle(ctx, x + 12 + k * (w - 24) / 3, -58, 8, ORE[k % 3], COLOR_INK, 2.5);   // Erz obenauf
    quad(ctx, x + 4, -22, x + w - 4, -22, x + w, -58, x, -58, STEEL, COLOR_INK, 3);
    H.line(ctx, x + 3, -40, x + w - 3, -40, STEEL_DARK, 3, 'butt');
    H.rect(ctx, x + 1, -60, w - 2, 6, STEEL_LIGHT, COLOR_INK, 2.5);
    for (let k = 0; k < 3; k++) H.circle(ctx, x + 14 + k * (w - 28) / 2, -31, 2.2, STEEL_DARK, null);   // Nieten
  }
  function haulyRad(ctx, cx, cy, r, ang) {   // Riesenrad mit Profil und Speichen
    H.circle(ctx, cx, cy, r, TIRE, COLOR_INK, 3);
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang);
    ctx.fillStyle = '#4A4A4A';
    for (let k = 0; k < 8; k++) { ctx.rotate(Math.PI / 4); ctx.fillRect(-3, -r + 3, 6, 7); }
    H.circle(ctx, 0, 0, r * 0.58, STEEL_LIGHT, COLOR_INK, 2.5);
    ctx.beginPath(); for (let k = 0; k < 5; k++) { ctx.rotate(Math.PI * 2 / 5); ctx.moveTo(0, 0); ctx.lineTo(0, -r * 0.5); }   // Speichen
    ctx.lineCap = 'round'; ctx.lineWidth = 4; ctx.strokeStyle = STEEL_DARK; ctx.stroke();
    H.circle(ctx, 0, 0, r * 0.2, STEEL_DARK, COLOR_INK, 2);
    ctx.restore();
  }

  registerSection({

          H.line(ctx, bx - 10, by + fl, bx, by - 4, COLOR_INK, 2.5); H.line(ctx, bx, by - 4, bx + 10, by + fl, COLOR_INK, 2.5);
        }

      // Fichtenkamm (eigener Durchlauf, damit keine Kachel den Nachbarkamm überdeckt)

    /* ----- Mitte (0.45): Almhänge, Serpentinen, Fichten, Almhütte, Kühe, Latschen ----- */
    drawMid(ctx, env) {
      const n = env.night, f = env.layer, P = 1000;
      const Lmin = f * env.section.startX, Lmax = f * (env.section.endX - 1900);   // Ebenen-x, ab dem eine Kachel in die Lift-Zone geraten könnte
      const wiese = H.lerpColor(WIESE, WIESE_N, n), wiese2 = H.lerpColor(WIESE2, WIESE2_N, n), kontur = H.lerpColor(KONTUR, KONTUR_N, n);
      const fichte = H.lerpColor(FICHTE, FICHTE_N, n), latsche = H.lerpColor(LATSCHE, LATSCHE_N, n);
      env.tile(P, (sx, i) => {
        const L = i * P;
        const treeK = H.clamp((Lmax - L) / 1800, 0, 1);            // 1 = Wald, 0 = über der Baumgrenze
        const hutOK = L + 720 <= Lmax && L + 560 >= Lmin;
        // Hang mit Höhenlinien
        polyAt(ctx, HILL, sx, G, (i & 1) ? wiese : wiese2, COLOR_INK, 3);
        profStroke(ctx, HILL, sx, G, 36, kontur, 3); profStroke(ctx, HILL, sx, G, 74, kontur, 3);

        // Felskante am Kamm oberhalb der Baumgrenze
        if (treeK < 0.7) polyAt(ctx, KANTE, sx + 640, G + profY(HILL, 700) + 4, STEIN_D, COLOR_INK, 3);
        // Fichten (Richtung Gipfel kleiner, dann Latschen)
        for (let k = 0; k < 5; k++) {
          if (hutOK && k === 3) continue;

        // Almhütte auf dem Kamm-Absatz
        if (hutOK) { if (i & 1) stadel(ctx, sx + 640, G + profY(HILL, 640) + 2, env); else { const d = Math.abs(i >> 1) % 3; huette(ctx, sx + 640, G + profY(HILL, 640) + 2, env, DACH[d], DACH_H[d]); } }
      });
    },

     nicht verlassen. Auto-Sperre auf "Nie" stellen (Wake-Lock ist
     unter iOS Safari nicht immer verfügbar).

ANDROID (Chrome)
  1. Datei kopieren und in Chrome öffnen: file:///sdcard/Download/index.html
     oder über einen lokalen Server (siehe unten).
  2. Chrome-Menü → "Zum Startbildschirm hinzufügen" → startet als
     Vollbild-App. Der erste Tap fordert außerdem Fullscreen an.
  3. Einstellungen → "Bildschirm anheften" (App-Pinning) aktivieren,
     damit niemand aus dem Spiel herauskommt.

LOKALER SERVER (zum Testen im WLAN)
  Im Ordner der Datei:   python3 -m http.server 8080
  Dann am Tablet:        http://<IP-des-Laptops>:8080/
  (IP am Mac: Systemeinstellungen → WLAN → Details, oder `ipconfig getifaddr en0`)

BEDIENUNG
  Tap / Klick / Leertaste = Springen, halten = höher springen.
  Gamepad: A/B/X/Y, Schultern, Trigger, Start, Steuerkreuz/Stick hoch =
  Springen (halten = höher), Select/Back = Ton an/aus. Wird automatisch
  erkannt, sobald eine Taste am Controller gedrückt wird.
  Namenseingabe mit Gamepad: Steuerkreuz/Stick bewegt den Cursor über die
  Tastatur (Auto-Repeat beim Halten), A = Taste tippen, B = löschen,
  Start = "Passt!" bestätigen.
  M = Ton an/aus (Button oben rechts).
  Admin: 5× schnell auf das Logo im Start-Screen tippen → Bestenliste
  löschen oder als Text in die Zwischenablage exportieren.
  Nach 45 s ohne Eingabe: Attract-Mode (Demo), Tap = zurück zum Start.

  ?section=freibad  ?weather=2  ?t=6  ?freeze=1  ?auto=1  ?god=1  ?boxes=1

TUNING
  Alles im CONFIG-Objekt ganz oben: Tempo, Sprung, Leben, Punkte, Combo,
