const IMG = {};
function loadImages() {
  const all = Object.assign({}, MERCH_IMAGES);
  OUTFITS.forEach(o => { if (o.image) all['outfit_' + o.id] = o.image; });
  for (const k in all) {
    if (!all[k]) continue;
    try {
      const im = new Image();
      im.onload = () => { IMG[k] = im; };
      im.src = all[k];
    } catch (e) { /* ohne Bild geht's gezeichnet weiter */ }
  }
}

/* =====================================================================
   Zeichen-Helfer (H) – dicke Outlines, flacher Cartoon-Stil
   Alle Funktionen nehmen ctx als erstes Argument.
   ===================================================================== */
const H = {
  clamp: (v, a, b) => v < a ? a : v > b ? b : v,
  lerp: (a, b, t) => a + (b - a) * t,
  hex(c) { const n = parseInt(c.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; },
  rgb(r, g, b) { return '#' + [r, g, b].map(v => H.clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join(''); },
  // amt > 0 heller, < 0 dunkler (-1..1)
  shade(c, amt) { const [r, g, b] = H.hex(c);
    if (amt >= 0) return H.rgb(r + (255 - r) * amt, g + (255 - g) * amt, b + (255 - b) * amt);
    const f = 1 + amt; return H.rgb(r * f, g * f, b * f); },
  lerpColor(a, b, t) { const A = H.hex(a), B = H.hex(b); return H.rgb(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t); },
  rgba(c, alpha) { const [r, g, b] = H.hex(c); return `rgba(${r},${g},${b},${alpha})`; },

  rrPath(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
  },
  // Rechteck mit Outline. stroke = null → ohne Outline. r = Eckenradius
  rect(ctx, x, y, w, h, fill, stroke = COLOR_INK, lw = 3, r = 0) {
    if (r > 0) H.rrPath(ctx, x, y, w, h, r); else { ctx.beginPath(); ctx.rect(x, y, w, h); }
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); }
  },
  circle(ctx, x, y, r, fill, stroke = COLOR_INK, lw = 3) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); }
  },
  ellipse(ctx, x, y, rx, ry, fill, stroke = COLOR_INK, lw = 3) {
    ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); }
  },
  // pts = [x0,y0, x1,y1, …]
  poly(ctx, pts, fill, stroke = COLOR_INK, lw = 3, close = true) {
    ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
    for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
    if (close) ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); }
  },
  line(ctx, x0, y0, x1, y1, color = COLOR_INK, lw = 3, cap = 'round') {
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
    ctx.lineCap = cap; ctx.lineWidth = lw; ctx.strokeStyle = color; ctx.stroke();
  },
  tri(ctx, x0, y0, x1, y1, x2, y2, fill, stroke = COLOR_INK, lw = 3) { H.poly(ctx, [x0, y0, x1, y1, x2, y2], fill, stroke, lw); },
  // Text-Helfer (Kurzform von txt)
  text(ctx, s, x, y, size, color = COLOR_INK, o = {}) { txt(s, x, y, Object.assign({ size, color }, o)); },

  // --- Natur ---
  // Runder Laubbaum, (x, baseY) = Stammfuß, s = Höhe
  tree(ctx, x, baseY, s, leaf = '#5FAF3A', trunk = '#7A4B23') {
    H.rect(ctx, x - s * 0.07, baseY - s * 0.45, s * 0.14, s * 0.45, trunk, COLOR_INK, 3);
    const r = s * 0.3;
    ctx.beginPath();
    ctx.arc(x, baseY - s * 0.62, r, 0, Math.PI * 2);
    ctx.arc(x - r * 0.8, baseY - s * 0.5, r * 0.8, 0, Math.PI * 2);
    ctx.arc(x + r * 0.8, baseY - s * 0.5, r * 0.8, 0, Math.PI * 2);
    ctx.arc(x, baseY - s * 0.82, r * 0.75, 0, Math.PI * 2);
    ctx.fillStyle = leaf; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = COLOR_INK; ctx.stroke();
    // Glanz
    ctx.beginPath(); ctx.arc(x - r * 0.35, baseY - s * 0.78, r * 0.35, 0, Math.PI * 2);
    ctx.fillStyle = H._light[leaf] || (H._light[leaf] = H.shade(leaf, 0.35)); ctx.fill();
  },
  _winCache: [], _light: {},
  // Nadelbaum (Fichte)
  pine(ctx, x, baseY, s, color = '#2F7A3A', trunk = '#6B3F1E') {
    H.rect(ctx, x - s * 0.05, baseY - s * 0.2, s * 0.1, s * 0.2, trunk, COLOR_INK, 3);
    for (let i = 0; i < 3; i++) {
      const y = baseY - s * 0.15 - i * s * 0.25, w = s * (0.36 - i * 0.08), h = s * 0.4;
      H.tri(ctx, x - w, y, x + w, y, x, y - h, i === 2 ? H.shade(color, 0.12) : color);
    }
  },
  bush(ctx, x, baseY, s, color = '#4E9E34') {
    ctx.beginPath();
    ctx.arc(x - s * 0.35, baseY - s * 0.3, s * 0.32, 0, Math.PI * 2);
    ctx.arc(x + s * 0.35, baseY - s * 0.3, s * 0.32, 0, Math.PI * 2);
    ctx.arc(x, baseY - s * 0.45, s * 0.4, 0, Math.PI * 2);
    ctx.fillStyle = color; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = COLOR_INK; ctx.stroke();
  },
  cloud(ctx, x, y, s, color = '#FFFFFF', alpha = 1) {
    ctx.save(); ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(x, y, s * 0.5, 0, Math.PI * 2);
    ctx.arc(x + s * 0.55, y + s * 0.1, s * 0.4, 0, Math.PI * 2);
    ctx.arc(x - s * 0.55, y + s * 0.12, s * 0.38, 0, Math.PI * 2);
    ctx.arc(x + s * 0.15, y - s * 0.25, s * 0.35, 0, Math.PI * 2);
    ctx.fillStyle = color; ctx.fill();
    ctx.restore();
  },
  // Fenster: lit 0..1 = nachts leuchtend (gelb)
  win(ctx, x, y, w, h, lit = 0, frame = COLOR_INK) {
    const q = Math.round(lit * 20);   // 21 Stufen, gecacht (keine Strings pro Frame)
    const col = q > 0 ? (H._winCache[q] || (H._winCache[q] = H.lerpColor('#7FB6E0', '#FFE27A', q / 20))) : '#7FB6E0';
    H.rect(ctx, x, y, w, h, col, frame, 2.5);
    if (lit > 0.3) { ctx.save(); ctx.globalAlpha = 0.35 * lit; ctx.fillStyle = '#FFE27A'; ctx.fillRect(x - 3, y - 3, w + 6, h + 6); ctx.restore(); }
    else { ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(x + 2, y + 2, w * 0.35, h * 0.35); }
  },
  // Wehende Fahne an Stange, (x, baseY) = Stangenfuß
  flag(ctx, x, baseY, h, color = COLOR_PRIMARY, t = 0) {
    H.line(ctx, x, baseY, x, baseY - h, COLOR_INK, 4);
    const w = h * 0.45, fh = h * 0.28, y = baseY - h;
    const s1 = Math.sin(t * 6) * 4, s2 = Math.sin(t * 6 + 1.5) * 4;
    H.poly(ctx, [x, y, x + w, y + s1, x + w * 0.8, y + fh / 2 + s2, x + w, y + fh + s1, x, y + fh], color, COLOR_INK, 3);
  },
  star(ctx, x, y, r, color = COLOR_GOLD, stroke = COLOR_INK) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
      ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath(); ctx.fillStyle = color; ctx.fill();
    if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = 2.5; ctx.strokeStyle = stroke; ctx.stroke(); }
  },
  heart(ctx, x, y, s, color = COLOR_KORTSCHAK) {
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.35);
    ctx.bezierCurveTo(x - s * 0.5, y - s * 0.05, x - s * 0.5, y - s * 0.5, x - s * 0.05, y - s * 0.4);
    ctx.bezierCurveTo(x, y - s * 0.5, x, y - s * 0.5, x + s * 0.05, y - s * 0.4);
    ctx.bezierCurveTo(x + s * 0.5, y - s * 0.5, x + s * 0.5, y - s * 0.05, x, y + s * 0.35);
    ctx.closePath(); ctx.fillStyle = color; ctx.fill();
    ctx.lineJoin = 'round'; ctx.lineWidth = 2.5; ctx.strokeStyle = COLOR_INK; ctx.stroke();
  },
  // Deterministischer Zufall 0..1 für Kachel-Index i (und Salz k)
  rnd(i, k = 0) { let x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); },
};

/* ---------- Text ---------- */
let ctx; // wird in initCanvas gesetzt (txt braucht es global)
function txt(s, x, y, o = {}) {
  const size = o.size || 32;
  ctx.font = `${o.weight || 900} ${size}px ${FONT}`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.baseline || 'middle';
  if (o.stroke) {
    ctx.lineJoin = 'round';
    ctx.lineWidth = o.strokeW || Math.max(3, size * 0.18);
    ctx.strokeStyle = o.stroke;
    ctx.strokeText(s, x, y);
  }
  ctx.fillStyle = o.color || '#fff';
  ctx.fillText(s, x, y);
}
function textWidth(s, size, weight = 900) {
  ctx.font = `${weight} ${size}px ${FONT}`;
  return ctx.measureText(s).width;
}
// Fetter Retro-Titel mit Versatz-Schatten
function bigTitle(s, x, y, size, color = '#fff', shadow = COLOR_PRIMARY_DARK) {
  txt(s, x + size * 0.06, y + size * 0.06, { size, color: shadow, stroke: COLOR_INK, strokeW: size * 0.2 });
  txt(s, x, y, { size, color, stroke: COLOR_INK, strokeW: size * 0.2 });
}

/* =====================================================================
   Canvas & Skalierung – logische Höhe 720, Breite je nach Seitenverhältnis (960–1700)
   ===================================================================== */
const canvas = document.getElementById('c');
const VH = 720;
let W = 1280, scale = 1, offX = 0, offY = 0, dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = Math.max(1, window.innerWidth), ch = Math.max(1, window.innerHeight);
  W = Math.round(H.clamp(VH * cw / ch, 960, 1700));
  scale = Math.min(cw / W, ch / VH);
  offX = (cw - W * scale) / 2; offY = (ch - VH * scale) / 2;
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
}
function toLogical(e) { return { x: (e.clientX - offX) / scale, y: (e.clientY - offY) / scale }; }

/* =====================================================================
   Input – ein Tap = Springen, halten = höher. Maus, Leertaste + Gamepad werden auch unterstützt.
   ===================================================================== */
const input = {
  down: false, downSince: 0, lastActivity: 0,
  aiHoldUntil: 0,      // Attract-Mode "hält" den Finger
};
const UI = {
  buttons: [],         // je Frame neu: {id, x, y, w, h}
  add(id, x, y, w, h) { this.buttons.push({ id, x, y, w, h }); },
  hit(p) {
    if (!p) return null;
    for (let i = this.buttons.length - 1; i >= 0; i--) {
      const b = this.buttons[i];
      if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) return b.id;
    }
    return null;
  },
};

function onPress(p, viaGamepad = false) {
  input.lastActivity = game.now;
  Sound.unlock();
  // Gamepad-Polling zählt nicht als User-Geste – Fullscreen-Versuch für echten Tap aufheben
  if (!viaGamepad) tryFullscreen();
  tryWakeLock();
  input.down = true; input.downSince = game.now;
  Screens[game.state].press(p);
}
function onRelease() {
  input.down = false;
  Screens[game.state].release && Screens[game.state].release();
}
function initInput() {
  canvas.addEventListener('pointerdown', e => { e.preventDefault(); onPress(toLogical(e)); }, { passive: false });
  window.addEventListener('pointerup', e => { onRelease(); });
  window.addEventListener('pointercancel', e => { onRelease(); });
  // Gesten (Pinch, Doppeltap-Zoom, Pull-to-Refresh) unterbinden
  ['touchstart', 'touchmove', 'touchend', 'gesturestart', 'gesturechange'].forEach(ev =>
    document.addEventListener(ev, e => { e.preventDefault(); }, { passive: false }));
  document.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('keydown', e => {
    if (e.repeat) return;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') { e.preventDefault(); onPress(null); }
    if (e.key === 'm' || e.key === 'M') Sound.toggle();
    if (Screens[game.state].key) Screens[game.state].key(e);
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') onRelease();
  });
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));
}

/* ---------- Gamepad – A/B/X/Y, Schultern, Trigger, Start, Steuerkreuz/Stick hoch = Springen,
   Select/Back = Ton an/aus. Wird jeden Frame gepollt (Gamepad API liefert keine Events pro Taste). */
const PAD_JUMP_BUTTONS = [0, 1, 2, 3, 4, 5, 6, 7, 9, 12];
const pad = {
  connected: false, wasDown: false, wasMute: false, noticeUntil: 0,
  // Namenseingabe: Cursor auf der Bildschirmtastatur (Zeile 4 = "Passt!"-Button)
  inName: false, navRow: 0, navCol: 0,
  dirX: 0, dirY: 0, dirRepeatAt: 0, wasA: false, wasB: false, wasStart: false,
};
function pollGamepad() {
  if (!navigator.getGamepads) return;
  let gp = null;
  try {
    const list = navigator.getGamepads();
    for (let i = 0; i < list.length; i++) if (list[i] && list[i].connected) { gp = list[i]; break; }
  } catch (e) { return; }
  if (!gp) {
    if (pad.wasDown) { pad.wasDown = false; onRelease(); }
    pad.connected = false; pad.inName = false;
    return;
  }
  if (!pad.connected) { pad.connected = true; pad.noticeUntil = game.now + 3500; }
  const mute = !!(gp.buttons[8] && gp.buttons[8].pressed);
  if (mute && !pad.wasMute) Sound.toggle();
  pad.wasMute = mute;
  if (game.state === ST.ENTER_NAME) { padNameEntry(gp); return; }
  pad.inName = false;
  const stickUp = gp.axes.length > 1 && gp.axes[1] < -0.6;
  const down = stickUp || PAD_JUMP_BUTTONS.some(i => gp.buttons[i] && gp.buttons[i].pressed);
  if (down && !pad.wasDown) onPress(null, true);
  else if (!down && pad.wasDown) onRelease();
  pad.wasDown = down;
}
/* Namenseingabe per Steuerkreuz/Stick: navigieren, A = Taste, B = löschen, Start = "Passt!".
   Mit Auto-Repeat beim Halten einer Richtung. */
function padNameEntry(gp) {
  const S = Screens.ENTER_NAME, btn = i => !!(gp.buttons[i] && gp.buttons[i].pressed);
  const a = btn(0), b = btn(1), start = btn(9);
  if (!pad.inName) {
    // Noch gehaltene Tasten vom vorigen Screen übernehmen, damit sie hier nichts auslösen
    pad.inName = true; pad.wasA = a; pad.wasB = b; pad.wasStart = start;
    pad.dirX = 0; pad.dirY = 0;
  }
  const ax0 = gp.axes.length > 0 ? gp.axes[0] : 0, ax1 = gp.axes.length > 1 ? gp.axes[1] : 0;
  const dx = btn(15) ? 1 : btn(14) ? -1 : ax0 > 0.5 ? 1 : ax0 < -0.5 ? -1 : 0;
  const dy = btn(13) ? 1 : btn(12) ? -1 : ax1 > 0.5 ? 1 : ax1 < -0.5 ? -1 : 0;
  let moved = false;
  if (dx !== pad.dirX || dy !== pad.dirY) {
    pad.dirX = dx; pad.dirY = dy; pad.dirRepeatAt = game.now + 350;
    moved = !!(dx || dy);
  } else if ((dx || dy) && game.now >= pad.dirRepeatAt) {
    pad.dirRepeatAt = game.now + 130; moved = true;
  }
  if (moved) {
    input.lastActivity = game.now;
    if (dy) pad.navRow = (pad.navRow + dy + 5) % 5;
    if (dx && pad.navRow < 4) pad.navCol = (pad.navCol + dx + 10) % 10;
  }
  if (a && !pad.wasA) { input.lastActivity = game.now; S.activate(pad.navRow === 4 ? 'ok' : 'k:' + KEY_ROWS[pad.navRow][pad.navCol]); }
  if (b && !pad.wasB) { input.lastActivity = game.now; S.activate('k:⌫'); }
  if (start && !pad.wasStart) { input.lastActivity = game.now; S.activate('ok'); }
  pad.wasA = a; pad.wasB = b; pad.wasStart = start;
  // Sprung-Mapping erst wieder scharf, wenn alles losgelassen wurde (sonst springt der nächste Screen sofort)
  pad.wasDown = ax1 < -0.6 || PAD_JUMP_BUTTONS.some(i => btn(i));
}

/* ---------- Fullscreen & Wake-Lock (Fallback ohne Fehler) ---------- */
let fsTried = false, wakeLock = null;
function tryFullscreen() {
  if (fsTried) return; fsTried = true;
  try {
    const el = document.documentElement;
    const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
    if (fn) { const r = fn.call(el, { navigationUI: 'hide' }); if (r && r.catch) r.catch(() => {}); }
  } catch (e) { /* iOS Safari kann das nicht – egal */ }
}
function tryWakeLock() {
  try {
    if (!('wakeLock' in navigator) || wakeLock) return;
    navigator.wakeLock.request('screen').then(l => {
      wakeLock = l; l.addEventListener('release', () => { wakeLock = null; });
    }).catch(() => {});
  } catch (e) { /* nicht verfügbar */ }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') tryWakeLock(); });

/* =====================================================================
   Sound – alles synthetisch per Web Audio API, kein Audio-File
   ===================================================================== */
const Sound = {
  ac: null, master: null,
  muted: (() => { try { return localStorage.getItem('trofaiach_runner_muted') === '1'; } catch (e) { return false; } })(),
  unlock() {
    try {
      if (!this.ac) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ac = new AC();
        this.master = this.ac.createGain();
        this.master.gain.value = 0.55;
        this.master.connect(this.ac.destination);
      }
      if (this.ac.state === 'suspended') this.ac.resume();
    } catch (e) { this.ac = null; }
  },
  toggle() {
    this.muted = !this.muted;
    try { localStorage.setItem('trofaiach_runner_muted', this.muted ? '1' : '0'); } catch (e) {}
    if (!this.muted) this.ui();
  },
  get ok() { return this.ac && !this.muted && this.ac.state === 'running'; },
  // Ton mit Hüllkurve; to = Zielfrequenz (Slide)
  tone(f, dur, o = {}) {
    if (!this.ok) return;
    const t0 = this.ac.currentTime + (o.delay || 0);
    const osc = this.ac.createOscillator(), g = this.ac.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(f, t0);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.to), t0 + dur);
    const v = o.vol || 0.25;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(v, t0 + (o.attack || 0.008));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(this.master);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  },
  noise(dur, o = {}) {
    if (!this.ok) return;
    const t0 = this.ac.currentTime + (o.delay || 0);
    const n = Math.floor(this.ac.sampleRate * dur);
    const buf = this.ac.createBuffer(1, n, this.ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = this.ac.createBufferSource(); src.buffer = buf;
    const flt = this.ac.createBiquadFilter();
    flt.type = o.filter || 'lowpass';
    flt.frequency.setValueAtTime(o.f || 1200, t0);
    if (o.to) flt.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);
    const g = this.ac.createGain();
    g.gain.setValueAtTime(o.vol || 0.3, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(flt); flt.connect(g); g.connect(this.master);
    src.start(t0); src.stop(t0 + dur + 0.02);
  },
  // --- Ereignisse ---
  jump() { this.tone(320, 0.14, { type: 'triangle', to: 720, vol: 0.28 }); },
  land() { this.noise(0.06, { f: 500, vol: 0.12 }); },
  // Sammeln: steigende Tonleiter je nach Combo
  collect(n) {
    const scale = [523, 587, 659, 784, 880, 1047, 1175, 1319, 1568, 1760];
    const f = scale[Math.min(scale.length - 1, Math.max(0, n))];
    this.tone(f, 0.09, { type: 'square', vol: 0.16 });
    this.tone(f * 2, 0.12, { type: 'sine', vol: 0.12, delay: 0.05 });
  },
  hit() { this.noise(0.22, { f: 900, to: 150, vol: 0.35 }); this.tone(180, 0.28, { type: 'sawtooth', to: 55, vol: 0.25 }); },
  splash() { this.noise(0.5, { filter: 'bandpass', f: 1400, to: 250, vol: 0.4 }); this.tone(420, 0.35, { type: 'sine', to: 120, vol: 0.2 }); },
  // Kirchturm-Glocke: unharmonische Teiltöne, langer Ausklang, zwei Schläge
  bell() {
    const base = 330, parts = [[1, 0.5], [2.0, 0.28], [2.42, 0.2], [3.01, 0.12], [4.2, 0.07]];
    [0, 0.9].forEach(d => parts.forEach(([m, v]) => this.tone(base * m, 2.4, { type: 'sine', vol: v * 0.35, delay: d, attack: 0.004 })));
  },
  boost() { this.noise(0.55, { filter: 'bandpass', f: 600, to: 3000, vol: 0.3 }); this.tone(260, 0.5, { type: 'sawtooth', to: 1100, vol: 0.14 }); },
  rush() { [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, 0.16, { type: 'square', vol: 0.18, delay: i * 0.07 })); },
  magnet() { this.tone(200, 0.6, { type: 'sine', to: 900, vol: 0.2 }); this.tone(300, 0.6, { type: 'triangle', to: 1350, vol: 0.12, delay: 0.05 }); },
  gipfel() { [392, 523, 659, 784, 1047].forEach((f, i) => this.tone(f, i === 4 ? 0.6 : 0.2, { type: 'square', vol: 0.2, delay: i * 0.13 })); },
  pop() { this.noise(0.18, { f: 2500, to: 300, vol: 0.28 }); },
  lift() { this.tone(220, 1.2, { type: 'sine', to: 330, vol: 0.1 }); this.tone(330, 1.2, { type: 'triangle', to: 440, vol: 0.06, delay: 0.3 }); },
  life() { this.tone(440, 0.25, { type: 'square', to: 220, vol: 0.22 }); this.tone(220, 0.4, { type: 'square', to: 110, vol: 0.2, delay: 0.25 }); },
  gameover() { [392, 330, 262, 196].forEach((f, i) => this.tone(f, 0.35, { type: 'triangle', vol: 0.25, delay: i * 0.28 })); },
  record() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => this.tone(f, 0.18, { type: 'square', vol: 0.2, delay: i * 0.11 })); },
  ui() { this.tone(880, 0.06, { type: 'square', vol: 0.12 }); },
  key() { this.tone(660, 0.05, { type: 'triangle', vol: 0.14 }); },
  banner() { this.tone(660, 0.1, { type: 'square', vol: 0.12 }); this.tone(990, 0.14, { type: 'square', vol: 0.1, delay: 0.08 }); },
  duck() { this.tone(900, 0.08, { type: 'square', to: 600, vol: 0.08 }); this.tone(900, 0.08, { type: 'square', to: 600, vol: 0.08, delay: 0.12 }); },
};

/* =====================================================================
   State-Machine & Spielzustand
   START → PLAYING → GAMEOVER → (ENTER_NAME) → GAMEOVER(Liste) → START/PLAYING
   ATTRACT: Demo nach 45 s Inaktivität, Tap = zurück zu START
   ===================================================================== */
const ST = { START: 'START', PLAYING: 'PLAYING', GAMEOVER: 'GAMEOVER', ENTER_NAME: 'ENTER_NAME', ATTRACT: 'ATTRACT' };
const game = {
  state: ST.START, stateAt: 0,
  now: 0,              // ms Spieluhr – läuft mit den Update-Schritten (60 und 120 Hz identisch)
  time: 0,             // Sekunden im aktuellen Lauf (Tempo, Wetter)
  weatherOffset: 0,    // nur für Tests (?weather=2)
  outfit: 0,
  score: 0, meters: 0,
  result: null,        // {score, meters, isRecord, qualifies, rank}
  nameChars: [],
  goPhase: 'result', goAt: 0, highlight: -1,
  attract: false, auto: false, god: false, freeze: false,
  overAt: 0,
  adminOpen: false, adminToast: null, logoTaps: [],
};
function setState(s) {
  game.state = s; game.stateAt = game.now; UI.buttons.length = 0;
  if (Screens[s].enter) Screens[s].enter();
}

/* =====================================================================
   Abschnitte – Registrierung & Reihenfolge
   ===================================================================== */
const SECTIONS = [];
function registerSection(def) {
  if (CONFIG.SECTION_LENGTH_M[def.id] != null) def.lengthM = CONFIG.SECTION_LENGTH_M[def.id];
  def.lengthPx = def.lengthM * CONFIG.PX_PER_METER;
  def.obstacles = def.obstacles || [];
  def.decos = def.decos || [];
  def.items = def.items || ['sticker', 'cap', 'shirt'];
  SECTIONS.push(def);
}
function sectionDef(id) { return SECTIONS.find(s => s.id === id) || null; }
function rand(a, b) { return a + Math.random() * (b - a); }
function pick(list) { return list[Math.floor(Math.random() * list.length)]; }
function pickWeighted(list) {
  let total = 0; for (const e of list) total += (e.weight || 1);
  let r = Math.random() * total;
  for (const e of list) { r -= (e.weight || 1); if (r <= 0) return e; }
  return list[list.length - 1];
}

const world = {};
const player = {};
let objSeq = 0;

function resetWorld(forceFirst = null) {
  Object.assign(world, {
    x: 0, speed: CONFIG.SPEED_START, lapBonus: 0,
    sections: [], queued: 0, sinceSummit: 0, laps: 0, level: 1, sectionsDone: 0, current: null,
    spawnX: CONFIG.START_GRACE_M * CONFIG.PX_PER_METER, noSpawnUntilX: 0, liftZones: [],
    objs: [], items: [], gaps: [], particles: [], floats: [], banner: null, fireworks: [],
    boostUntil: 0, rushUntil: 0, magnetUntil: 0, hitAt: -1e9,
    lift: null, summits: [], pendingBanner: null,
    itemPoints: 0, forceFirst,
  });
  Object.assign(player, {
    x: Math.round(W * 0.24), y: GROUND_Y, vy: 0, w: 44, h: 104,
    onGround: true, platform: null, platformBox: null,
    holding: false, coyote: 0, buffer: 0, wantJump: false, jumpStartedAt: -1,
    invulnUntil: 0, stumbleUntil: 0, lives: CONFIG.LIVES, combo: 0,
    sx: 1, sy: 1, falling: false, prevFeet: GROUND_Y, mountT: 0, sliding: false,
  });
  ensureSections();
}

// Nächster Abschnitt: 1. Runde in Registrier-Reihenfolge, danach gemischt (nach Level gefiltert),
// Bergwelt nach SECTIONS_BEFORE_SUMMIT Abschnitten, danach immer Stadtpark.
function nextSectionDef() {
  const secs = world.sections;
  const park = sectionDef('stadtpark') || SECTIONS[0];
  if (!secs.length) return (world.forceFirst && sectionDef(world.forceFirst)) || park;
  const last = secs[secs.length - 1].def;
  if (game.attract) return park;
  if (last.summit) return park;
  const summit = SECTIONS.find(s => s.summit);
  if (summit && world.sinceSummit >= CONFIG.SECTIONS_BEFORE_SUMMIT) return summit;
  const regular = SECTIONS.filter(s => !s.summit);
  if (world.laps === 0 && !world.forceFirst) {
    const order = regular.filter(s => (s.minLevel || 1) <= 1);
    const i = order.indexOf(last);
    if (i >= 0 && i < order.length - 1) return order[i + 1];
  }
  const pool = regular.filter(s => s !== last && (s.minLevel || 1) <= world.level);
  if (!pool.length) return park;
  return pickWeighted(pool);
}
function appendSection() {
  const def = nextSectionDef();
  const startX = world.sections.length ? world.sections[world.sections.length - 1].endX : 0;
  const sec = { def, startX, endX: startX + def.lengthPx, index: world.queued++, entered: false };
  world.sections.push(sec);
  if (def.summit) world.sinceSummit = 0; else world.sinceSummit++;
  if (startX > 0) world.objs.push(makeSign(startX, def));
  if (def.summit) placeSummit(sec);
  return sec;
}
function ensureSections() {
  while (!world.sections.length || world.sections[world.sections.length - 1].endX < world.x + W * 2) appendSection();
  while (world.sections.length > 1 && world.sections[0].endX < world.x - 400) world.sections.shift();
}
function sectionAt(wx) {
  for (const s of world.sections) if (wx >= s.startX && wx < s.endX) return s;
  return null;
}
function checkSectionEnter(wx) {
  const sec = sectionAt(wx);
  if (!sec || sec.entered) return;
  sec.entered = true;
  world.current = sec;
  if (sec.index > 0) world.sectionsDone++;
  world.level = DEBUG.level || 1 + Math.floor(world.sectionsDone / CONFIG.SECTIONS_PER_LEVEL);
  if (sec.def.banner && !game.attract) {
    if (world.lift) world.pendingBanner = sec.def.banner; else banner(sec.def.banner, sec.def.bannerColor);
  }
  if (sec.def.onEnter) { try { sec.def.onEnter(sec); } catch (e) { console.warn(e); } }
}

/* ---------- Welt-Objekte (Hindernisse, Deko, Ortstafel, Gipfelkreuz) ---------- */
function makeObj(def, x) {
  const o = {
    def, x, lift: 0, w: def.w, h: def.h, kind: def.kind || 'static', vx: def.speed || 0,
    t: Math.random() * 10, s: {}, bannerDone: false, id: objSeq++, removed: false,
  };
  o.boxes = def.boxes ? def.boxes : (def.noHit || o.kind === 'deco' ? [] : [{ x: 0, y: 0, w: def.w, h: def.h, platform: !!def.platform }]);
  if (def.init) def.init(o);
  return o;
}
const SIGN_DEF = {
  id: 'sign', w: 44, h: 140, kind: 'deco', noHit: true,
  draw(ctx, o, env) {
    H.rect(ctx, 18, -100, 8, 100, '#8C8C8C', COLOR_INK, 3);
    H.rect(ctx, -60, -140, 164, 48, '#1E5AA8', COLOR_INK, 4, 8);
    H.rect(ctx, -54, -134, 152, 36, null, '#FFFFFF', 2.5, 6);
    txt(o.s.text, 22, -116, { size: 22, color: '#fff' });
  },
};
function makeSign(x, def) { const o = makeObj(SIGN_DEF, x); o.s.text = def.name; return o; }

/* ---------- Gipfelkreuz + Sessellift (Bergwelt) ---------- */
const SUMMIT_DEF = {
  id: 'gipfelkreuz', w: 60, h: 190, kind: 'deco', noHit: true,
  draw(ctx, o, env) {
    // Felsblock + Steinmandl
    H.poly(ctx, [-40, 0, -30, -30, 0, -46, 34, -34, 48, 0], '#8E8A84', COLOR_INK, 3);
    H.poly(ctx, [-10, -46, 2, -62, 18, -48], '#A9A49E', COLOR_INK, 2.5);
    // Kreuz
    H.rect(ctx, -6, -190, 12, 146, '#8B5A2B', COLOR_INK, 3);
    H.rect(ctx, -34, -160, 68, 12, '#8B5A2B', COLOR_INK, 3);
    // Gipfelbuch-Kästchen
    H.rect(ctx, -12, -100, 24, 18, '#C9A227', COLOR_INK, 2.5);
  },
};
function placeSummit(sec) {
  const liftDist = CONFIG.LIFT_SPEED * CONFIG.LIFT_MS / 1000;
  const x = sec.endX + 50 - liftDist;
  const sm = {
    x, sec, reached: false, startWX: x + 250, endWX: x + 250 + liftDist,
    topY: GROUND_Y - 380, botY: GROUND_Y - 130, chairs: [0.15, 0.4, 0.65, 0.9],
  };
  world.summits.push(sm);
  world.liftZones.push({ from: x - 380, to: sm.endWX + 420 });
  sec.liftFromX = x - 380;   // ab hier keine Hindernisse mehr (für Module: env.section.liftFromX)
  world.objs.push(makeObj(SUMMIT_DEF, x));
  world.items.push(makeItem(x, GROUND_Y - 150, 'bonus'));
}
function cableY(sm, wx) {
  const u = H.clamp((wx - sm.startWX) / (sm.endWX - sm.startWX), 0, 1);
  return H.lerp(sm.topY, sm.botY, u) + Math.sin(u * Math.PI) * 34;
}

/* ---------- Items (Merch) ---------- */
function makeItem(x, y, type) { return { x, y, type, r: 22, taken: false, bob: Math.random() * 6.28, vx: 0, vy: 0, stone: false }; }
function spawnItems(def, x0, x1, obs) {
  const pool = def.items.filter(t => t !== 'nugget');
  const type = pick(pool.length ? pool : ['sticker']);
  const jumpable = obs && obs.h <= 110 && !obs.def.speed && !obs.def.platformY;
  const r = Math.random();
  if (jumpable && r < 0.45) {
    // Bogen über dem Hindernis
    const cx = obs.x + obs.w / 2, top = GROUND_Y - obs.h - 78;
    for (let i = -2; i <= 2; i++) world.items.push(makeItem(cx + i * 46, top + i * i * 17, type));
  } else if (r < 0.8) {
    const n = 3 + Math.floor(Math.random() * 3), sp = 48;
    if (x1 - x0 < n * sp) return;
    const sx = rand(x0, x1 - n * sp);
    const y = def.itemsOnStones ? GROUND_Y - 36 : GROUND_Y - 56 - Math.random() * 50;
    for (let i = 0; i < n; i++) { const it = makeItem(sx + i * sp, y, type); it.stone = !!def.itemsOnStones; world.items.push(it); }
  } else {
    const n = 4, sp = 50;
    if (x1 - x0 < n * sp) return;
    const sx = rand(x0, x1 - n * sp);
    for (let i = 0; i < n; i++) world.items.push(makeItem(sx + i * sp, GROUND_Y - 60 - i * 30, type));
  }
  if (def.nuggetChance && Math.random() < def.nuggetChance && x1 - x0 > 100)
    world.items.push(makeItem(rand(x0, x1), GROUND_Y - 130, 'nugget'));
}

/* ---------- Spawner – füllt die Strecke rechts vom Bildschirm ---------- */
function spawn() {
  let guard = 0;
  while (world.spawnX < world.x + W + 320 && guard++ < 60) spawnOne();
}
function spawnOne() {
  if (world.spawnX < world.noSpawnUntilX) { world.spawnX = world.noSpawnUntilX; return; }
  for (const z of world.liftZones) if (world.spawnX >= z.from && world.spawnX < z.to) { world.spawnX = z.to; return; }
  const sec = sectionAt(world.spawnX);
  if (!sec) { ensureSections(); if (!sectionAt(world.spawnX)) world.spawnX += 200; return; }
  const def = sec.def;
  if (world.spawnX < sec.startX + 260) { world.spawnX = sec.startX + 260; return; }
  if (world.spawnX > sec.endX - 200) { world.spawnX = sec.endX + 1; return; }

  const speedF = Math.pow(Math.max(world.speed, CONFIG.SPEED_START) / CONFIG.SPEED_START, CONFIG.GAP_SPEED_EXP);
  const levelF = Math.max(0.65, 1 - CONFIG.GAP_LEVEL_SHRINK * (world.level - 1));
  const easyF = 1 + 0.45 * Math.max(0, 1 - game.time / CONFIG.EASY_START_S);
  const gap = rand(CONFIG.GAP_MIN, CONFIG.GAP_MAX) * speedF * levelF * easyF;

  let placedW = 0, obs = null;
  if (def.gaps && Math.random() < CONFIG.BACH_GAP_CHANCE && game.time > 4) {
    const gw = Math.min(CONFIG.BACH_GAP_MAX * 1.3, rand(CONFIG.BACH_GAP_MIN, CONFIG.BACH_GAP_MAX) * (1 + 0.1 * (world.level - 1)));
    world.gaps.push({ x: world.spawnX, w: gw });
    placedW = gw;
  } else {
    const easy = game.time < CONFIG.EASY_START_S && !DEBUG.easyOff;
    const pool = def.obstacles.filter(d => (DEBUG.easyOff || (d.minLevel || 1) <= world.level) && !(easy && d.hard));
    if (pool.length) {
      const od = pickWeighted(pool);
      obs = makeObj(od, world.spawnX);
      world.objs.push(obs);
      placedW = od.w;
    }
  }
  const free0 = world.spawnX + placedW + 90, free1 = world.spawnX + placedW + gap - 90;
  if (Math.random() < CONFIG.ITEM_CHANCE && free1 - free0 > 120) spawnItems(def, free0, free1, obs);
  if (def.decos.length && Math.random() < CONFIG.DECO_CHANCE && free1 - free0 > 160) {
    const dd = pickWeighted(def.decos);
    world.objs.push(makeObj(dd, rand(free0, free1 - dd.w)));
  }
  world.spawnX += placedW + gap;
}

/* =====================================================================
   Spieler – Physik, Sprung, Plattformen, Lücken, Leben
   ===================================================================== */
function playerWX() { return world.x + player.x; }
function overGap(wx) {
  for (const g of world.gaps) if (wx > g.x + 10 && wx < g.x + g.w - 10) return g;
  return null;
}
function platformTop(o, b, wx) {
  if (o.def.platformY) return GROUND_Y - o.lift - o.def.platformY(wx - o.x);
  return GROUND_Y - o.lift - b.y - b.h;
}
function doJump() {
  player.vy = -CONFIG.JUMP_V;
  player.onGround = false; player.platform = null; player.sliding = false;
  player.holding = true; player.jumpStartedAt = game.now;
  player.buffer = 0; player.coyote = 0;
  player.sy = 1.22; player.sx = 0.84;
  spawnParticles(8, player.x, player.y, { vx: [-120, 60], vy: [-90, -10], g: 260, life: 0.45, size: [3, 7], color: ['#D9C9A3', '#C4B08A', '#FFFFFF'], scroll: 1 });
  Sound.jump();
}
function land() {
  player.sy = 0.8; player.sx = 1.18;
  spawnParticles(10, player.x, player.y, { vx: [-160, 160], vy: [-120, -20], g: 300, life: 0.4, size: [3, 6], color: ['#D9C9A3', '#C4B08A'], scroll: 1 });
  Sound.land();
}
function landOn(o, b, top) {
  player.platform = o; player.platformBox = b;
  player.y = top; player.vy = 0; player.onGround = true; player.falling = false;
  land();
  if (o.def.boost) { startBoost(); player.sliding = true; }
  if (o.def.onLand) o.def.onLand(o);
}
function startBoost() {
  world.boostUntil = game.now + CONFIG.BOOST_MS;
  banner('Wusch!', COLOR_WATER);
  Sound.boost();
}
function updatePlayer(dt) {
  const now = game.now;
  const held = input.down || now < input.aiHoldUntil;
  player.prevFeet = player.y;
  player.x = Math.round(W * 0.24);

  // Sessellift
  if (world.lift) {
    const sm = world.lift;
    player.mountT = Math.min(1, player.mountT + dt * 2.2);
    const e = player.mountT * player.mountT * (3 - 2 * player.mountT);
    player.y = H.lerp(GROUND_Y, cableY(sm, playerWX()) + 96, e);
    player.vy = 0; player.onGround = false; player.platform = null;
    return;
  }

  // Sprung-Puffer & Coyote-Time
  if (player.wantJump) { player.buffer = CONFIG.BUFFER_MS; player.wantJump = false; }
  else if (player.buffer > 0) player.buffer -= dt * 1000;
  if (player.onGround) player.coyote = CONFIG.COYOTE_MS; else player.coyote -= dt * 1000;
  if (player.buffer > 0 && player.coyote > 0 && !player.falling && now >= player.stumbleUntil) doJump();

  if (!held) player.holding = false;

  // Plattform (Hauly-Ladefläche, Rutsche) verfolgen
  if (player.platform) {
    const o = player.platform, b = player.platformBox, wx = playerWX();
    const bx0 = o.x + b.x, bx1 = bx0 + b.w;
    if (o.removed || wx < bx0 - 6 || wx > bx1 + 6) { player.platform = null; player.onGround = false; player.sliding = false; }
    else { player.y = platformTop(o, b, wx); player.vy = 0; player.onGround = true; }
    if (player.sliding && o.def.boost)
      spawnParticles(2, player.x - 10, player.y, { vx: [-260, -80], vy: [-160, -40], g: 500, life: 0.5, size: [3, 7], color: [COLOR_WATER, '#BFE9FF', '#FFFFFF'], scroll: 0 });
  }

  // Schwerkraft
  if (!player.onGround) {
    const holdOk = held && player.holding && (now - player.jumpStartedAt) < CONFIG.HOLD_MAX_MS && player.vy < 0;
    player.vy += (holdOk ? CONFIG.HOLD_GRAVITY : CONFIG.GRAVITY) * dt;
    player.y += player.vy * dt;
  }

  // Boden oder Lücke
  if (!player.platform && player.y >= GROUND_Y) {
    const g = overGap(playerWX());
    if (g) {
      if (!player.falling) { player.falling = true; player.onGround = false; }
      if (player.y > GROUND_Y + CONFIG.FALL_DEATH_PX) splash(g);
    } else {
      if (!player.onGround) land();
      player.y = GROUND_Y; player.vy = 0; player.onGround = true; player.falling = false;
    }
  }
  // Squash & Stretch abklingen
  player.sy += (1 - player.sy) * Math.min(1, dt * 11);
  player.sx += (1 - player.sx) * Math.min(1, dt * 11);
}
function splash(g) {
  Sound.splash();
  spawnParticles(30, player.x, GROUND_Y + 10, { vx: [-220, 220], vy: [-420, -120], g: 900, life: 0.8, size: [3, 8], color: [COLOR_WATER, '#BFE9FF', '#FFFFFF'], scroll: 1 });
  banner('Platsch!', COLOR_WATER);
  loseLife();
  // Hinter der Lücke weiter
  const wx = playerWX();
  world.x += (g.x + g.w + 40) - wx;
  player.y = GROUND_Y; player.vy = 0; player.falling = false; player.onGround = true;
  player.invulnUntil = game.now + CONFIG.INVULN_MS;
  player.stumbleUntil = game.now + 250;
}
function hitPlayer(o) {
  Sound.hit();
  player.stumbleUntil = game.now + CONFIG.STUMBLE_MS;
  player.invulnUntil = game.now + CONFIG.INVULN_MS;
  world.hitAt = game.now;
  world.noSpawnUntilX = Math.max(world.noSpawnUntilX, world.x + W + CONFIG.HIT_GRACE_PX);
  player.platform = null; player.sliding = false;
  if (player.onGround) { player.vy = -260; player.onGround = false; }
  spawnParticles(10, player.x, player.y - 50, { vx: [-200, 200], vy: [-260, -60], g: 500, life: 0.6, size: [3, 6], color: [COLOR_ACCENT, '#FFD27A', '#FFFFFF'], scroll: 0 });
  floatText('Autsch!', player.x, player.y - 130, COLOR_ACCENT);
  loseLife();
}
function loseLife() {
  player.combo = 0;
  world.rushUntil = 0;
  if (game.god) return;
  player.lives--;
  if (player.lives <= 0) {
    player.lives = 0;
    if (game.attract) { game.overAt = game.now + 600; }
    else { game.overAt = game.now + 900; Sound.gameover(); }
  } else Sound.life();
}

/* ---------- Objekte, Items, Effekte ---------- */
function updateObjs(dt) {
  const wx = playerWX();
  for (const o of world.objs) {
    o.t += dt;
    if (o.vx) o.x -= o.vx * dt;
    if (o.kind === 'bounce') o.lift = Math.abs(Math.sin(o.t * (o.def.bounceRate || 3.4))) * (o.def.bounceH || 80);
    if (o.def.update) { try { o.def.update(o, dt, env); } catch (e) { console.warn(e); } }
    if (o.def.banner && !o.bannerDone && o.x - world.x < W + 30 && !game.attract) { o.bannerDone = true; banner(o.def.banner, o.def.bannerColor || COLOR_ACCENT); }
    if (o.x + o.w < world.x - 260) o.removed = true;
  }
  if (world.objs.some(o => o.removed)) world.objs = world.objs.filter(o => !o.removed);
  world.gaps = world.gaps.filter(g => g.x + g.w > world.x - 300);
  world.liftZones = world.liftZones.filter(z => z.to > world.x - 300);
  world.summits = world.summits.filter(s => s.endWX > world.x - 600);
  // Gipfel & Sessellift
  for (const sm of world.summits) {
    if (!sm.reached && wx >= sm.x) {
      sm.reached = true;
      banner('Gipfel!', COLOR_GOLD); Sound.gipfel();
      for (let i = 0; i < 7; i++) world.fireworks.push({ at: game.now + 300 + i * 380, x: W * (0.35 + Math.random() * 0.55), y: 90 + Math.random() * 200, color: pick([COLOR_PRIMARY, COLOR_ACCENT, COLOR_GOLD, '#FF5C8A', '#5CC8FF', '#FFFFFF']) });
    }
    if (!world.lift && sm.reached && wx >= sm.startWX && wx < sm.endWX) {
      world.lift = sm; player.mountT = 0; player.platform = null; player.sliding = false; Sound.lift();
      if (!game.attract) banner('Ab ins Tal!', COLOR_PRIMARY);
    }
  }
  if (world.lift && wx >= world.lift.endWX) {
    world.lift = null; player.onGround = false; player.vy = 0;
    world.laps++; world.lapBonus += CONFIG.SPEED_LAP_BONUS;
    if (world.pendingBanner) { banner(world.pendingBanner); world.pendingBanner = null; }
  }
  // Feuerwerk
  for (const f of world.fireworks) if (game.now >= f.at) { burst(f.x, f.y, f.color); f.done = true; }
  world.fireworks = world.fireworks.filter(f => !f.done);
}
function updateItems(dt) {
  const now = game.now, magnet = now < world.magnetUntil;
  const pcx = player.x, pcy = player.y - player.h * 0.5;
  for (const it of world.items) {
    if (it.taken) continue;
    it.bob += dt * 4;
    const sx = it.x - world.x;
    if (magnet) {
      const dx = pcx - sx, dy = pcy - it.y, d = Math.hypot(dx, dy);
      if (d < CONFIG.MAGNET_RADIUS && d > 1) {
        const v = CONFIG.MAGNET_PULL * dt;
        it.x += dx / d * v; it.y += dy / d * v;
      }
    }
    const dx = (it.x - world.x) - pcx, dy = it.y - pcy;
    if (Math.abs(dx) < 34 + it.r * 0.5 && Math.abs(dy) < 62 + it.r * 0.5) collect(it);
    if (it.x - world.x < -100) it.taken = true;
  }
  if (world.items.some(i => i.taken)) world.items = world.items.filter(i => !i.taken);
}
function collect(it) {
  it.taken = true;
  const sx = it.x - world.x;
  if (it.type === 'nugget') {
    world.magnetUntil = game.now + CONFIG.MAGNET_MS;
    banner('Magnet!', '#B5561D'); Sound.magnet();
    spawnParticles(16, sx, it.y, { vx: [-200, 200], vy: [-200, 200], g: 0, life: 0.6, size: [3, 6], color: ['#F6C445', '#B5561D', '#FFFFFF'], scroll: 0 });
    return;
  }
  player.combo++;
  let pts = it.type === 'bonus' ? CONFIG.POINTS_BONUS_SHIRT : CONFIG.POINTS_ITEM;
  const rush = game.now < world.rushUntil;
  if (rush) pts *= 2;
  world.itemPoints += pts;
  floatText('+' + pts, sx, it.y - 30, it.type === 'bonus' ? COLOR_GOLD : (rush ? COLOR_ACCENT : '#FFFFFF'));
  spawnParticles(8, sx, it.y, { vx: [-150, 150], vy: [-150, 150], g: 0, life: 0.45, size: [2, 5], color: [COLOR_PRIMARY, '#FFFFFF', COLOR_GOLD], scroll: 0 });
  if (it.type === 'bonus') { Sound.record(); banner('Bonus-Shirt ×5!', COLOR_GOLD); }
  else Sound.collect(player.combo % CONFIG.COMBO_NEED);
  if (player.combo > 0 && player.combo % CONFIG.COMBO_NEED === 0) {
    world.rushUntil = game.now + CONFIG.RUSH_MS;
    banner('Merch-Rausch!', COLOR_ACCENT); Sound.rush();
    confetti();
  }
}
function targetSpeed() {
  const now = game.now;
  let s = Math.min(CONFIG.SPEED_MAX, CONFIG.SPEED_START + CONFIG.SPEED_ACCEL * game.time + world.lapBonus);
  const sinceHit = now - world.hitAt;
  if (sinceHit < CONFIG.HIT_SLOW_MS) s *= H.lerp(CONFIG.HIT_SLOW, 1, sinceHit / CONFIG.HIT_SLOW_MS);
  if (now < world.boostUntil) s *= CONFIG.BOOST_FACTOR;
  else if (world.boostUntil && !player.onGround && now - world.boostUntil < 1500) s *= CONFIG.BOOST_FACTOR;   // in der Luft bleibt der Turbo bis zur Landung
  else world.boostUntil = 0;
  if (world.lift) s = CONFIG.LIFT_SPEED;
  if (now < player.stumbleUntil && !world.lift) s *= 0.5;
  return s;
}

/* ---------- Kollisionen ---------- */
function collide() {
  const now = game.now, wx = playerWX();
  const pb = { x0: wx - 12, x1: wx + 12, y0: player.y - player.h + 10, y1: player.y - 3 };
  // Landen auf Plattformen (Hauly-Ladefläche, Rutsche)
  if (!player.platform && !player.onGround && player.vy >= 0 && !world.lift) {
    for (const o of world.objs) {
      if (!o.boxes.length) continue;
      for (const b of o.boxes) {
        if (!b.platform && !o.def.platformY) continue;
        const bx0 = o.x + b.x, bx1 = bx0 + b.w;
        if (wx < bx0 || wx > bx1) continue;
        const top = platformTop(o, b, wx);
        if (player.prevFeet <= top + 10 && player.y >= top - 2) { landOn(o, b, top); break; }
      }
      if (player.platform) break;
    }
  }
  if (now < player.invulnUntil || game.god || world.lift) return;
  for (const o of world.objs) {
    for (const b of o.boxes) {
      const bx0 = o.x + b.x, bx1 = bx0 + b.w;
      let by1 = GROUND_Y - o.lift - b.y, by0 = by1 - b.h;
      if (b.platform || o.def.platformY) {
        if (player.platform === o) continue;
        by0 = platformTop(o, b, H.clamp(wx, bx0, bx1)) + 14;  // Oberseite bleibt begehbar
      }
      if (pb.x1 > bx0 && pb.x0 < bx1 && pb.y1 > by0 && pb.y0 < by1) { hitPlayer(o); return; }
    }
  }
}

/* ---------- Attract-Mode / Auto-Spieler ----------
   Rechnet die Flugbahn (Tap oder Halten) aus CONFIG und springt im frühesten sicheren Moment. */
function jumpArc(hold) {
  const v0 = CONFIG.JUMP_V, gH = CONFIG.HOLD_GRAVITY, g = CONFIG.GRAVITY, th = hold ? CONFIG.HOLD_MAX_MS / 1000 : 0;
  const y1 = v0 * th - 0.5 * gH * th * th, v1 = v0 - gH * th;
  const apex = y1 + v1 * v1 / (2 * g);
  const air = th + v1 / g + Math.sqrt(2 * apex / g);
  const y = t => t < th ? v0 * t - 0.5 * gH * t * t : y1 + v1 * (t - th) - 0.5 * g * (t - th) * (t - th);
  return { air, apex, y };
}
function aiControl() {
  if (!player.onGround || world.lift || game.now < player.stumbleUntil) return;
  const wx = playerWX();
  let need = null;
  for (const o of world.objs) {
    if (!o.boxes.length || o.x + o.w < wx - 5) continue;
    // alle Boxen zusammenfassen (Reihenfolge egal): Gesamtbreite, höchste Kante, vorderer Nicht-Plattform-Teil
    let x0 = Infinity, x1 = -Infinity, h = 0, plat = !!(o.def.boost || o.def.platformY), fx1 = -Infinity, fh = 0;
    for (const b of o.boxes) {
      const bx0 = o.x + b.x, bx1 = bx0 + b.w, top = b.y + b.h;
      x0 = Math.min(x0, bx0); x1 = Math.max(x1, bx1); h = Math.max(h, top);
      if (b.platform) plat = true; else { fx1 = Math.max(fx1, bx1); fh = Math.max(fh, top); }
    }
    const dist = x0 - wx;
    if (dist > 720 || dist < -30) continue;
    const extra = o.kind === 'bounce' ? (o.def.bounceH || 80) : (o.lift || 0);
    const c = { dist, w: x1 - x0, h: h + extra, rel: world.speed + (o.vx || 0), plat };
    if (plat) {   // vorderer Teil, der übersprungen werden muss (Kabine, Rutschenturm)
      c.frontW = fx1 > -Infinity ? fx1 - x0 : 30;
      c.frontH = (fx1 > -Infinity ? fh : (o.def.platformY ? o.def.platformY(0) : h)) + extra;
    }
    if (!need || dist < need.dist) need = c;
  }
  for (const g of world.gaps) {
    const dist = g.x - wx;
    if (g.x + g.w < wx - 5 || dist > 720) continue;
    if (!need || dist < need.dist) need = { dist, w: g.w, gap: true, rel: world.speed };
  }
  if (!need) return;
  const jump = hold => { player.wantJump = true; input.aiHoldUntil = game.now + (hold ? CONFIG.HOLD_MAX_MS + 30 : 30); };
  const margin = 12 + world.speed * 0.045;   // Landemarge wächst mit dem Tempo (ein Schritt = speed/120 px)
  if (need.plat) {   // Vorderkante überspringen, dann oben landen
    for (const hold of [true, false]) {
      const arc = jumpArc(hold), t0 = Math.max(0, need.dist - 12) / need.rel, t1 = (need.dist + need.frontW + margin) / need.rel;
      if (t1 < arc.air && arc.y(t0) > need.frontH + 8 && arc.y(t1) > need.frontH + 8) { jump(hold); return; }
    }
    if (need.dist <= 24) jump(true);
    return;
  }
  for (const hold of [false, true]) {
    const arc = jumpArc(hold);
    let ok;
    if (need.gap) ok = arc.air * need.rel >= need.dist + need.w + 18 + margin && need.dist >= -8;
    else {
      const t0 = Math.max(0, need.dist - 12) / need.rel, t1 = (need.dist + need.w + margin) / need.rel;
      ok = t1 < arc.air && arc.y(t0) > need.h + 8 && arc.y(t1) > need.h + 8;
    }
    if (ok) { jump(hold); return; }
  }
  if (need.dist <= 24) jump(true);   // passt nie ganz – so spät wie möglich, hoch
}

/* ---------- Partikel, Schwebetexte, Banner ---------- */
function spawnParticles(n, x, y, o) {
  if (world.particles.length > 420) return;
  for (let i = 0; i < n; i++) {
    world.particles.push({
      x, y, vx: rand(o.vx[0], o.vx[1]), vy: rand(o.vy[0], o.vy[1]), g: o.g || 0,
      life: o.life * rand(0.7, 1.2), age: 0, size: rand(o.size[0], o.size[1]),
      color: pick(o.color), shape: o.shape || 'circle', scroll: o.scroll || 0, rot: Math.random() * 6.28, spin: rand(-6, 6),
    });
  }
}
function burst(x, y, color) {
  Sound.pop();
  for (let i = 0; i < 34; i++) {
    const a = i / 34 * Math.PI * 2, v = rand(120, 300);
    world.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 220, life: rand(0.8, 1.3), age: 0, size: rand(3, 6), color: i % 3 ? color : '#FFFFFF', shape: 'circle', scroll: 0, rot: 0, spin: 0 });
  }
}
function confetti() {
  for (let i = 0; i < 70; i++) world.particles.push({
    x: rand(0, W), y: rand(-40, -5), vx: rand(-60, 60), vy: rand(80, 220), g: 120, life: rand(1.6, 2.6), age: 0, size: rand(5, 9),
    color: pick([COLOR_PRIMARY, COLOR_ACCENT, COLOR_GOLD, '#FF5C8A', '#5CC8FF', '#FFFFFF']), shape: 'confetti', scroll: 0, rot: Math.random() * 6.28, spin: rand(-8, 8),
  });
}
function floatText(text, x, y, color = '#fff') { world.floats.push({ text, x, y, color, age: 0, life: 0.9 }); }
function banner(text, color = COLOR_PRIMARY) { world.banner = { text, color, at: game.now, dur: 1500 }; Sound.banner(); }
function updateEffects(dt) {
  for (const p of world.particles) {
    p.age += dt; p.vy += p.g * dt;
    p.x += (p.vx - (p.scroll ? world.speed : 0)) * dt; p.y += p.vy * dt; p.rot += p.spin * dt;
  }
  world.particles = world.particles.filter(p => p.age < p.life);
  for (const f of world.floats) { f.age += dt; f.y -= 60 * dt; }
  world.floats = world.floats.filter(f => f.age < f.life);
}

/* =====================================================================
   Wetter & Tageszeit – alle 90 s: Sonne → Abendrot → Nacht → Morgen
   ===================================================================== */
const WEATHER = [
  { name: 'Sonne',    top: '#4FA3E8', bot: '#C6E9FF', sun: 1,   sunX: 0.8,  sunY: 110, sunColor: '#FFE45C', night: 0, cloud: 1 },
  { name: 'Abendrot', top: '#4A3A8C', bot: '#FF9A5C', sun: 1,   sunX: 0.6,  sunY: 430, sunColor: '#FF8A3C', night: 0.2, cloud: 0.9 },
  { name: 'Nacht',    top: '#0A1238', bot: '#2B3A78', sun: 0,   sunX: 0.75, sunY: 130, sunColor: '#F4F1D8', night: 1, cloud: 0.3 },
  { name: 'Morgen',   top: '#7FA9D8', bot: '#FFE0B0', sun: 1,   sunX: 0.3,  sunY: 380, sunColor: '#FFD36B', night: 0.15, cloud: 0.8 },
];
const env = {
  W: 1280, H: VH, groundY: GROUND_Y, t: 0, night: 0, phase: 0, speed: 0, playerWX: 0, worldX: 0, level: 1,
  sky: { top: WEATHER[0].top, bot: WEATHER[0].bot }, sun: { x: 0, y: 0, alpha: 1, color: '#FFE45C' }, moon: 0, cloud: 1,
  scroll: 0, layer: 0, section: null,
  rnd: H.rnd,
  // Kacheln: ruft fn(sx, i) für jede sichtbare Kachel des Rasters `period` (in px) auf. sx = Bildschirm-x der Kachel.
  tile(period, fn, margin = 0) {
    const s = env.scroll, m = margin || period;
    const first = Math.floor((s - m) / period), last = Math.ceil((s + env.W + m) / period);
    for (let i = first; i <= last; i++) fn(i * period - s, i);
  },
};
function updateEnv() {
  const t = game.time + game.weatherOffset, cyc = CONFIG.WEATHER_CYCLE_S, fade = CONFIG.WEATHER_FADE_S;
  const i = Math.floor(t / cyc) % WEATHER.length, f = t % cyc;
  const k = f > cyc - fade ? (f - (cyc - fade)) / fade : 0;
  const a = WEATHER[i], b = WEATHER[(i + 1) % WEATHER.length];
  env.W = W; env.t = game.now / 1000; env.phase = i; env.speed = world.speed; env.playerWX = playerWX(); env.worldX = world.x; env.level = world.level;
  env.sky.top = H.lerpColor(a.top, b.top, k); env.sky.bot = H.lerpColor(a.bot, b.bot, k);
  env.night = H.lerp(a.night, b.night, k);
  env.cloud = H.lerp(a.cloud, b.cloud, k);
  env.sun.alpha = H.lerp(a.sun, b.sun, k);
  env.sun.x = H.lerp(a.sunX, b.sunX, k) * W; env.sun.y = H.lerp(a.sunY, b.sunY, k);
  env.sun.color = H.lerpColor(a.sunColor, b.sunColor, k);
  env.moon = H.lerp(a.sun ? 0 : 1, b.sun ? 0 : 1, k);
}

/* =====================================================================
   Zeichnen – Welt
   ===================================================================== */
const DEFAULT_GROUND = { top: '#6BBF3A', mid: '#E2CFA0', body: '#B8894E' };

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  g.addColorStop(0, env.sky.top); g.addColorStop(1, env.sky.bot);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, GROUND_Y + 30);
  // Sterne
  if (env.night > 0.05) {
    ctx.save(); ctx.fillStyle = '#FFFFFF';
    for (let i = 0; i < 70; i++) {
      const x = H.rnd(i, 3) * W, y = H.rnd(i, 4) * 400, r = 1.2 + H.rnd(i, 5) * 1.8;
      ctx.globalAlpha = env.night * (0.55 + 0.45 * Math.sin(env.t * 2.5 + i));
      ctx.fillRect(x, y, r, r);
    }
    ctx.restore();
  }
  // Sonne
  if (env.sun.alpha > 0.02) {
    ctx.save(); ctx.globalAlpha = env.sun.alpha;
    ctx.globalAlpha = env.sun.alpha * 0.25; H.circle(ctx, env.sun.x, env.sun.y, 66, env.sun.color, null);
    ctx.globalAlpha = env.sun.alpha; H.circle(ctx, env.sun.x, env.sun.y, 46, env.sun.color, COLOR_INK, 3);
    ctx.restore();
  }
  // Mond (Sichel)
  if (env.moon > 0.02) {
    ctx.save(); ctx.globalAlpha = env.moon;
    H.circle(ctx, W * 0.78, 120, 36, '#F4F1D8', COLOR_INK, 3);
    H.circle(ctx, W * 0.78 + 16, 108, 30, env.sky.top, null);
    ctx.restore();
  }
  // Wolken
  env.scroll = world.x * 0.05 + env.t * 8;
  const cc = env.night > 0.5 ? '#9AA2C8' : '#FFFFFF';
  env.tile(520, (sx, i) => {
    const y = 50 + H.rnd(i, 6) * 170, s = 36 + H.rnd(i, 7) * 40;
    H.cloud(ctx, sx + H.rnd(i, 8) * 300, y, s, cc, 0.9 * env.cloud);
  });
}
// Ferne Hügel (Obersteiermark) – global, hinter allen Abschnitten
function drawFarHills() {
  const bands = [[0.06, 210, '#8FBFD8', '#1C2650'], [0.11, 140, '#6FAE8A', '#182A48']];
  for (const [f, h, day, night] of bands) {
    const s = world.x * f;
    ctx.fillStyle = H.lerpColor(day, night, env.night);
    ctx.beginPath(); ctx.moveTo(0, GROUND_Y + 20);
    for (let x = 0; x <= W + 20; x += 20) {
      const wx = x + s;
      const y = GROUND_Y - h + 50 * Math.sin(wx / 260) + 28 * Math.sin(wx / 97 + 1.7) + 14 * Math.sin(wx / 41);
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W + 20, GROUND_Y + 20); ctx.closePath(); ctx.fill();
  }
}
function visibleSections() {
  const out = [];
  for (const sec of world.sections) {
    const sx0 = sec.startX - world.x, sx1 = sec.endX - world.x;
    if (sx1 < 0 || sx0 > W) continue;
    out.push({ sec, sx0: Math.max(0, sx0), sx1: Math.min(W, sx1) });
  }
  return out;
}
function drawSectionLayers() {
  const layers = [['drawFar', 0.2], ['drawMid', 0.45], ['drawNear', 0.75]];
  for (const v of visibleSections()) {
    ctx.save(); ctx.beginPath(); ctx.rect(v.sx0 - 1, 0, v.sx1 - v.sx0 + 2, VH); ctx.clip();
    env.section = v.sec;
    for (const [name, f] of layers) {
      const fn = v.sec.def[name]; if (!fn) continue;
      env.scroll = world.x * f; env.layer = f;
      ctx.save();
      try { fn(ctx, env); } catch (e) { console.warn(name, v.sec.def.id, e); }
      ctx.restore();
    }
    ctx.restore();
  }
  // Nebelschleier an den Abschnittsgrenzen – kaschiert den harten Schnitt der Parallax-Ebenen
  for (const v of visibleSections()) {
    const bx = v.sec.startX - world.x;
    if (v.sec.index === 0 || bx < -80 || bx > W + 80) continue;
    const g = ctx.createLinearGradient(bx - 90, 0, bx + 90, 0);
    const c = env.night > 0.5 ? env.sky.bot : '#FFFFFF';
    g.addColorStop(0, H.rgba(c, 0)); g.addColorStop(0.5, H.rgba(c, 0.75)); g.addColorStop(1, H.rgba(c, 0));
    ctx.fillStyle = g; ctx.fillRect(bx - 90, 0, 180, GROUND_Y);
  }
}
function drawGround() {
  for (const v of visibleSections()) {
    const g = v.sec.def.ground || DEFAULT_GROUND, w = v.sx1 - v.sx0;
    ctx.fillStyle = g.body; ctx.fillRect(v.sx0, GROUND_Y, w, VH - GROUND_Y);
    ctx.fillStyle = g.mid; ctx.fillRect(v.sx0, GROUND_Y + 14, w, 32);
    ctx.fillStyle = g.top; ctx.fillRect(v.sx0, GROUND_Y, w, 14);
    H.line(ctx, v.sx0, GROUND_Y, v.sx1, GROUND_Y, COLOR_INK, 3, 'butt');
    ctx.save(); ctx.beginPath(); ctx.rect(v.sx0, GROUND_Y, w, VH - GROUND_Y); ctx.clip();
    env.scroll = world.x; env.layer = 1; env.section = v.sec;
    if (v.sec.def.drawGround) { try { v.sec.def.drawGround(ctx, env, v.sx0, v.sx1); } catch (e) { console.warn(e); } }
    else {
      ctx.fillStyle = H.shade(g.mid, -0.18);
      env.tile(90, (sx, i) => { ctx.fillRect(sx + H.rnd(i) * 40, GROUND_Y + 24 + H.rnd(i, 1) * 12, 22, 4); });
    }
    ctx.restore();
  }
  // Lücken (Vordernbergerbach) – Wasser dunkelt nachts ab
  const water = env.night > 0.02 ? H.lerpColor(COLOR_WATER, '#1C3D6E', env.night) : COLOR_WATER;
  const waterDark = env.night > 0.02 ? H.lerpColor(COLOR_WATER_DARK, '#122A4E', env.night) : COLOR_WATER_DARK;
  for (const gp of world.gaps) {
    const sx = gp.x - world.x;
    if (sx > W || sx + gp.w < 0) continue;
    ctx.fillStyle = '#7A5A3A'; ctx.fillRect(sx, GROUND_Y - 2, gp.w, VH - GROUND_Y + 2);
    ctx.fillStyle = water; ctx.fillRect(sx, GROUND_Y + 18, gp.w, VH - GROUND_Y);
    ctx.fillStyle = waterDark; ctx.fillRect(sx, GROUND_Y + 60, gp.w, VH);
    ctx.strokeStyle = '#BFE9FF'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (let k = 0; k < 2; k++) {
      const y = GROUND_Y + 30 + k * 20;
      ctx.beginPath();
      for (let x = sx + 4; x <= sx + gp.w - 4; x += 6) ctx.lineTo(x, y + Math.sin((x + world.x) * 0.06 + env.t * 4 + k * 2) * 3);
      ctx.stroke();
    }
    H.line(ctx, sx, GROUND_Y, sx, GROUND_Y + 18, COLOR_INK, 3);
    H.line(ctx, sx + gp.w, GROUND_Y, sx + gp.w, GROUND_Y + 18, COLOR_INK, 3);
  }
}
// Sessellift (Stützen, Seil, Stationen, leere Sessel)
function drawChair(ctx, x, y, withPlayer) {
  H.line(ctx, x, y, x, y + 58, '#555555', 6);
  H.rect(ctx, x - 22, y + 56, 48, 9, '#C8102E', COLOR_INK, 3, 3);
  H.rect(ctx, x - 26, y + 22, 8, 40, '#C8102E', COLOR_INK, 3, 3);
  if (!withPlayer) H.rect(ctx, x - 18, y + 36, 44, 5, '#8C8C8C', COLOR_INK, 2.5);
}
function drawLift() {
  for (const sm of world.summits) {
    const x0 = sm.startWX - world.x, x1 = sm.endWX - world.x;
    if (x1 < -200 || x0 > W + 200) continue;
    // Stützen
    for (let wx = sm.startWX + 225; wx < sm.endWX; wx += 450) {
      const sx = wx - world.x; if (sx < -60 || sx > W + 60) continue;
      const cy = cableY(sm, wx);
      H.rect(ctx, sx - 7, cy - 4, 14, GROUND_Y - cy + 4, '#7A7A7A', COLOR_INK, 3);
      H.rect(ctx, sx - 24, cy - 12, 48, 12, '#9A9A9A', COLOR_INK, 3);
    }
    // Seil
    ctx.beginPath();
    for (let u = 0; u <= 1.0001; u += 0.02) { const wx = H.lerp(sm.startWX, sm.endWX, u); ctx.lineTo(wx - world.x, cableY(sm, wx)); }
    ctx.lineWidth = 4; ctx.strokeStyle = COLOR_INK; ctx.stroke();
    // Bergstation (Turm + Hütte) und Talstation
    H.rect(ctx, x0 - 16, sm.topY - 10, 32, GROUND_Y - sm.topY + 10, '#6E6E6E', COLOR_INK, 3);
    H.rect(ctx, x0 - 90, GROUND_Y - 70, 120, 70, '#D9C7A5', COLOR_INK, 3);
    H.tri(ctx, x0 - 100, GROUND_Y - 70, x0 + 40, GROUND_Y - 70, x0 - 30, GROUND_Y - 118, '#8B3A2E');
    txt('Lift', x0 - 30, GROUND_Y - 38, { size: 22, color: COLOR_INK });
    H.rect(ctx, x1 - 16, sm.botY - 10, 32, GROUND_Y - sm.botY + 10, '#6E6E6E', COLOR_INK, 3);
    H.rect(ctx, x1 - 30, GROUND_Y - 70, 120, 70, '#D9C7A5', COLOR_INK, 3);
    H.tri(ctx, x1 - 40, GROUND_Y - 70, x1 + 100, GROUND_Y - 70, x1 + 30, GROUND_Y - 118, '#8B3A2E');
    txt('Tal', x1 + 30, GROUND_Y - 38, { size: 22, color: COLOR_INK });
    // leere Sessel
    for (const u of sm.chairs) {
      const wx = H.lerp(sm.startWX, sm.endWX, u), sx = wx - world.x;
      if (sx < -60 || sx > W + 60) continue;
      drawChair(ctx, sx, cableY(sm, wx), false);
    }
  }
}
function drawObjs(deco) {
  for (const o of world.objs) {
    if ((o.kind === 'deco') !== deco) continue;
    const sx = o.x - world.x;
    if (sx + o.w + 260 < 0 || sx - 260 > W) continue;
    ctx.save(); ctx.translate(sx, GROUND_Y - o.lift);
    try { o.def.draw(ctx, o, env); } catch (e) { console.warn(o.def.id, e); }
    ctx.restore();
    if (DEBUG.boxes) for (const b of o.boxes) H.rect(ctx, sx + b.x, GROUND_Y - o.lift - b.y - b.h, b.w, b.h, null, b.platform ? '#0f0' : '#f00', 2);
  }
}
function drawItems() {
  for (const it of world.items) {
    const sx = it.x - world.x;
    if (sx < -60 || sx > W + 60) continue;
    if (it.stone) H.ellipse(ctx, sx, GROUND_Y - 8, 24, 10, '#9A958D', COLOR_INK, 2.5);
    const y = it.y + Math.sin(it.bob) * 4;
    if (it.type === 'bonus') { ctx.save(); ctx.globalAlpha = 0.35 + 0.2 * Math.sin(env.t * 6); H.circle(ctx, sx, y, 40, COLOR_GOLD, null); ctx.restore(); }
    drawMerch(ctx, it.type, sx, y, it.type === 'bonus' ? 56 : 44);
    if (it.type === 'bonus') txt('×5', sx, y - 44, { size: 22, color: COLOR_GOLD, stroke: COLOR_INK });
  }
}
function drawParticles() {
  for (const p of world.particles) {
    ctx.globalAlpha = Math.max(0, 1 - p.age / p.life);
    ctx.fillStyle = p.color;
    if (p.shape === 'confetti') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore(); }
    else ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}
function drawFloats() {
  for (const f of world.floats) {
    ctx.globalAlpha = Math.max(0, 1 - f.age / f.life);
    txt(f.text, f.x, f.y, { size: 30, color: f.color, stroke: COLOR_INK });
  }
  ctx.globalAlpha = 1;
}
function drawBanner() {
  const b = world.banner; if (!b) return;
  const age = game.now - b.at; if (age > b.dur) { world.banner = null; return; }
  const pop = age < 180 ? 1.25 * (1 - Math.pow(1 - age / 180, 3)) : age < 340 ? H.lerp(1.25, 1, (age - 180) / 160) : 1;
  ctx.save();
  ctx.globalAlpha = age > b.dur - 300 ? (b.dur - age) / 300 : 1;
  ctx.translate(W / 2, 250); ctx.scale(pop, pop);
  bigTitle(b.text, 0, 0, 76, b.color, H.shade(b.color, -0.4));
  ctx.restore();
}

/* =====================================================================
   Läufer (Spielfigur) – 4-Frame-Laufzyklus, Sprung, Stolpern, Sitzen
   (x, y) = Fußpunkt. pose: {frame, jump, stumble, sit, sx, sy}
   ===================================================================== */
function drawPrint(ctx, o, cx, cy, w) {
  const custom = IMG['outfit_' + o.id];
  if (custom) { const h = w * custom.height / custom.width; ctx.drawImage(custom, cx - w / 2, cy - h / 2, w, h); return; }
  if (IMG.logo) { const h = w * 312 / 960; ctx.drawImage(IMG.logo, cx - w / 2, cy - h / 2, w, h); return; }
  txt('TROFAIACH', cx, cy, { size: w * 0.2, color: o.shirt === '#FFFFFF' ? COLOR_PRIMARY : '#FFFFFF' });
}
function drawRunner(ctx, x, y, outfitIdx, pose = {}, opt = {}) {
  const o = OUTFITS[outfitIdx] || OUTFITS[0];
  const s = opt.scale || 1;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s * (pose.sx || 1), s * (pose.sy || 1));
  if (pose.stumble) ctx.rotate(-0.32);
  let A, B, armF, armB;
  if (pose.sit) { A = [22, -30]; B = [28, -26]; armF = [22, -62]; armB = [16, -64]; }
  else if (pose.stumble) { A = [24, -2]; B = [-20, 0]; armF = [30, -70]; armB = [24, -80]; }
  else if (pose.jump) { A = [16, -22]; B = [-12, -8]; armF = [24, -102]; armB = [-14, -106]; }
  else {
    const F = [[18, 0, -16, -12], [4, -16, -6, 0], [-16, -12, 18, 0], [-6, 0, 4, -16]][(pose.frame | 0) % 4];
    A = [F[0], F[1]]; B = [F[2], F[3]];
    armF = [8 + B[0] * 0.7, -60 + B[1] * 0.3]; armB = [-4 + A[0] * 0.7, -60 + A[1] * 0.3];
  }
  const leg = (fx, fy, back) => {
    const kx = fx / 2 + 7, ky = (-42 + fy) / 2 - 2;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(0, -42); ctx.lineTo(kx, ky); ctx.lineTo(fx, fy);
    ctx.lineWidth = 15; ctx.strokeStyle = COLOR_INK; ctx.stroke();
    ctx.lineWidth = 10; ctx.strokeStyle = back ? H.shade(o.pants, -0.25) : o.pants; ctx.stroke();
    H.ellipse(ctx, fx + 3, fy - 1, 10, 5.5, back ? '#D9D9D9' : '#FFFFFF', COLOR_INK, 2.5);
  };
  const arm = (tx, ty, back) => {
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, -78); ctx.lineTo(tx, ty);
    ctx.lineWidth = 12; ctx.strokeStyle = COLOR_INK; ctx.stroke();
    ctx.lineWidth = 7; ctx.strokeStyle = o.hood ? (back ? H.shade(o.shirt, -0.2) : o.shirt) : COLOR_SKIN; ctx.stroke();
    H.circle(ctx, tx, ty, 5, COLOR_SKIN, COLOR_INK, 2.5);
  };
  leg(B[0], B[1], true);
  arm(armB[0], armB[1], true);
  // Kapuze (hinter dem Kopf)
  if (o.hood) H.circle(ctx, -3, -98, 21, H.shade(o.shirt, -0.15), COLOR_INK, 3);
  // Rumpf
  H.rect(ctx, -18, -86, 36, 46, o.shirt, COLOR_INK, 3, 8);
  if (o.hood) H.rect(ctx, -12, -56, 24, 12, H.shade(o.shirt, -0.2), COLOR_INK, 2.5, 3);
  drawPrint(ctx, o, 0, -67, 28);
  // Kopf
  H.circle(ctx, 3, -102, 16, COLOR_SKIN, COLOR_INK, 3);
  if (o.cap) {
    ctx.beginPath(); ctx.arc(3, -104, 17, Math.PI, Math.PI * 2); ctx.closePath();
    ctx.fillStyle = o.cap; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = COLOR_INK; ctx.stroke();
    H.rect(ctx, 10, -107, 24, 8, o.cap, COLOR_INK, 3, 3);
    H.circle(ctx, 3, -121, 3, o.cap, COLOR_INK, 2);
    txt('T', 2, -110, { size: 11, color: o.cap === '#FFFFFF' ? COLOR_PRIMARY : '#FFFFFF' });
  } else {
    ctx.beginPath(); ctx.arc(3, -104, 16, Math.PI * 1.05, Math.PI * 1.98); ctx.closePath();
    ctx.fillStyle = o.hair; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = COLOR_INK; ctx.stroke();
    H.circle(ctx, -6, -114, 5, o.hair, COLOR_INK, 2);
  }
  // Gesicht
  if (pose.stumble) { H.line(ctx, 8, -107, 14, -101, COLOR_INK, 2.5); H.line(ctx, 14, -107, 8, -101, COLOR_INK, 2.5); }
  else H.circle(ctx, 11, -104, 2.6, COLOR_INK, null);
  ctx.beginPath(); ctx.arc(9, -96, 5, pose.stumble ? Math.PI : 0.1, pose.stumble ? Math.PI * 2 : Math.PI - 0.1);
  ctx.lineWidth = 2.2; ctx.strokeStyle = COLOR_INK; ctx.lineCap = 'round'; ctx.stroke();
  ctx.fillStyle = 'rgba(255,120,120,0.45)'; ctx.beginPath(); ctx.arc(2, -95, 3.2, 0, Math.PI * 2); ctx.fill();
  // vorne
  leg(A[0], A[1], false);
  arm(armF[0], armF[1], false);
  ctx.restore();
}
function drawPlayer() {
  const now = game.now;
  if (now < player.invulnUntil && !world.lift && Math.floor(now / 90) % 2 === 0) return;
  const pose = { sx: player.sx, sy: player.sy };
  if (world.lift) pose.sit = true;
  else if (now < player.stumbleUntil) pose.stumble = true;
  else if (player.sliding) pose.sit = true;
  else if (!player.onGround || player.falling) pose.jump = true;
  else pose.frame = Math.floor((world.x / 34) % 4);
  if (world.lift) drawChair(ctx, player.x + 4, player.y - 96, true);
  else if (!player.falling) {
    const base = player.platform ? player.y : GROUND_Y, hgt = base - player.y;
    ctx.save(); ctx.globalAlpha = 0.22 * H.clamp(1 - hgt / 320, 0.25, 1);
    H.ellipse(ctx, player.x, base - 2, Math.max(10, 26 - hgt * 0.04), 6, COLOR_INK, null);
    ctx.restore();
  }
  if (now < world.magnetUntil) {
    ctx.save(); ctx.globalAlpha = 0.25 + 0.15 * Math.sin(env.t * 10);
    H.circle(ctx, player.x, player.y - 52, 70 + 6 * Math.sin(env.t * 10), null, '#B5561D', 5);
    ctx.restore();
  }
  drawRunner(ctx, player.x, player.y, game.outfit, pose);
  if (world.lift) H.rect(ctx, player.x - 14, player.y - 58, 44, 6, '#8C8C8C', COLOR_INK, 2.5);
}

/* =====================================================================
   Merch-Icons (Sammel-Items) – Bild aus MERCH_IMAGES oder gezeichnet
   ===================================================================== */
function drawLogoSmall(ctx, cx, cy, w) {
  if (IMG.logo) { const h = w * 312 / 960; ctx.drawImage(IMG.logo, cx - w / 2, cy - h / 2, w, h); }
  else txt('T', cx, cy, { size: w * 0.45, color: COLOR_PRIMARY });
}
function drawMerch(ctx, type, x, y, s = 44) {
  const img = IMG[type];
  if (img) { ctx.drawImage(img, x - s / 2, y - s / 2, s, s); return; }

  const u = s / 44;

    const col = type === 'bonus' ? COLOR_GOLD : '#FFFFFF';
    H.poly(ctx, [-22 * u, -12 * u, -12 * u, -20 * u, -5 * u, -20 * u, 0, -15 * u, 5 * u, -20 * u, 12 * u, -20 * u, 22 * u, -12 * u, 16 * u, -2 * u, 12 * u, -4 * u, 12 * u, 20 * u, -12 * u, 20 * u, -12 * u, -4 * u, -16 * u, -2 * u], col, COLOR_INK, 3);
    drawLogoSmall(ctx, 0, 5 * u, 19 * u);
    if (type === 'bonus') { H.star(ctx, -20 * u, -22 * u, 7 * u, '#FFFFFF'); H.star(ctx, 22 * u, 10 * u, 5 * u, '#FFFFFF'); }
  } else if (type === 'cap') {
    ctx.beginPath(); ctx.arc(-2 * u, 2 * u, 16 * u, Math.PI, Math.PI * 2); ctx.closePath();
    ctx.fillStyle = COLOR_PRIMARY; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = COLOR_INK; ctx.lineJoin = 'round'; ctx.stroke();
    H.rect(ctx, 4 * u, 0, 20 * u, 7 * u, COLOR_PRIMARY, COLOR_INK, 3, 3 * u);
    H.circle(ctx, -2 * u, -14 * u, 3 * u, '#FFFFFF', COLOR_INK, 2);
    txt('T', -3 * u, -5 * u, { size: 13 * u, color: '#FFFFFF' });
  } else if (type === 'sticker') {
    H.circle(ctx, 0, 0, 21 * u, '#FFFFFF', COLOR_INK, 3);
    H.circle(ctx, 0, 0, 16 * u, null, COLOR_PRIMARY, 4 * u);
    drawLogoSmall(ctx, 0, 0, 26 * u);
  } else if (type === 'nugget') {
    H.poly(ctx, [-20 * u, 4 * u, -12 * u, -16 * u, 6 * u, -20 * u, 20 * u, -6 * u, 16 * u, 14 * u, -4 * u, 20 * u], '#8B3A1E', COLOR_INK, 3);
    H.poly(ctx, [-12 * u, -16 * u, 6 * u, -20 * u, 2 * u, -4 * u, -10 * u, -2 * u], '#B5561D', null);
    H.star(ctx, 8 * u, -6 * u, 6 * u, '#FFFFFF', null);
  }
  ctx.restore();
}

/* =====================================================================
   Bestenliste – localStorage, Top 10 mit Name, Punkte, Meter, Uhrzeit
   ===================================================================== */
const Scores = {
  load() {
    try { const a = JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEY) || '[]'); return Array.isArray(a) ? a.filter(e => e && typeof e.score === 'number') : []; }
    catch (e) { return []; }
  },
  save(list) { try { localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(list.slice(0, CONFIG.TOP_N))); } catch (e) {} },
  qualifies(score) { const l = this.load(); return l.length < CONFIG.TOP_N || score > l[l.length - 1].score; },
  add(entry) {
    const l = this.load(); l.push(entry);
    l.sort((a, b) => b.score - a.score || b.meters - a.meters);
    const idx = l.indexOf(entry);
    this.save(l);
    return idx < CONFIG.TOP_N ? idx : -1;
  },
  clear() { try { localStorage.removeItem(CONFIG.STORAGE_KEY); } catch (e) {} },
  exportText() {
    const l = this.load();
    if (!l.length) return 'Bestenliste ist leer.';
    return 'Trofaiach-Runner – Bestenliste\n' + l.map((e, i) => `${i + 1}. ${e.name} – ${e.score} Punkte – ${e.meters} m – ${e.date || ''} ${e.time || ''}`.trim()).join('\n');
  },
};
function copyText(t, done) {
  const fallback = () => {
    try {
      const ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.left = '-9999px'; document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy'); document.body.removeChild(ta); done(ok);
    } catch (e) { done(false); }
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(() => done(true)).catch(fallback);
    else fallback();
  } catch (e) { fallback(); }
}

/* ---------- GAME OVER ---------- */
function finishGame() {
  const score = game.score, meters = Math.floor(game.meters);
  const list = Scores.load(), best = list.length ? list[0].score : 0;
  game.result = { score, meters, isRecord: score > best && score > 0, qualifies: score > 0 && Scores.qualifies(score) };
  game.goPhase = 'result'; game.goAt = game.now; game.highlight = -1; game.nameChars = [];
  if (game.result.isRecord) Sound.record();
  setState(ST.GAMEOVER);
}
Screens.GAMEOVER = {
  update(dt) {
    updateEffects(dt); updateEnv();
    if (game.goPhase === 'result' && game.now - game.goAt > 3500) this.advance();
    if (game.goPhase === 'list' && game.now - input.lastActivity > CONFIG.ATTRACT_MS) startAttract();
  },
  advance() {
    if (game.result && game.result.qualifies) setState(ST.ENTER_NAME);
    else { game.goPhase = 'list'; game.goAt = game.now; }
  },
  draw() {
    drawWorld(true);
    ctx.fillStyle = 'rgba(26,29,26,0.6)'; ctx.fillRect(0, 0, W, VH);
    if (game.goPhase === 'result') drawResult(); else drawList();
    drawMuteButton(); drawKLogo(W - 44, VH - 44, 32);
  },
  press(p) {
    const id = UI.hit(p);
    if (id === 'mute') { Sound.toggle(); return; }
    if (game.goPhase === 'result') { if (game.now - game.goAt > 500) this.advance(); return; }
    if (id === 'again' || p === null) { Sound.ui(); startGame(); }
    else if (id === 'start') { Sound.ui(); setState(ST.START); }
  },
};

/* =====================================================================
   Hauptschleife – requestAnimationFrame mit festem Schritt (1/120 s):
   60 Hz und 120 Hz laufen identisch.
   ===================================================================== */
const DEBUG = { boxes: false, auto: false, forceFirst: null, easyOff: false, level: 0 };
const STEP = 1 / 120;
let lastT = 0, acc = 0;
function step(dt) { game.now += dt * 1000; Screens[game.state].update(dt); }
function frame(t) {
  if (!lastT) lastT = t;
  let dt = (t - lastT) / 1000; lastT = t;
  if (dt > 0.1) dt = 0.1;
  pollGamepad();
  acc += dt; let n = 0;
  while (acc >= STEP && n < 12) { step(STEP); acc -= STEP; n++; }
  if (n >= 12) acc = 0;
  draw();
  requestAnimationFrame(frame);
}
function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = COLOR_DARK; ctx.fillRect(0, 0, canvas.width / dpr, canvas.height / dpr);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, offX * dpr, offY * dpr);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, VH); ctx.clip();
  UI.buttons.length = 0;
  try { Screens[game.state].draw(); } catch (e) { console.error(e); }
  if (pad.connected && game.now < pad.noticeUntil)
    txt('🎮 Controller verbunden', W / 2, VH - 30, { size: 24, color: '#FFFFFF', stroke: COLOR_INK });
  ctx.restore();
}
function initCanvas() { ctx = canvas.getContext('2d'); resize(); }

/* ---------- Test-Parameter in der URL (nur zum Entwickeln) ----------
   ?section=freibad   startet direkt in diesem Abschnitt      ?auto=1  Auto-Spieler
   ?weather=2         Wetterphase 0..3 (Sonne/Abendrot/Nacht/Morgen)   ?t=6  6 s vorspulen
   ?freeze=1          Bild einfrieren (Screenshots)          ?god=1   unverwundbar
   ?screen=start|attract|gameover|name|list                  ?boxes=1 Hitboxen zeigen
   ?outfit=0..2       ?easy=0 (hard/minLevel ignorieren)     ?level=3     ?seed=42 (gleicher Zufall) */
function applyUrlParams() {
  let Q; try { Q = new URLSearchParams(location.search); } catch (e) { setState(ST.START); return; }
  if (Q.has('boxes')) DEBUG.boxes = true;
  if (Q.get('easy') === '0') DEBUG.easyOff = true;                    // hard/minLevel ignorieren
  if (Q.has('level')) DEBUG.level = parseInt(Q.get('level'), 10) || 0;  // Level festnageln
  if (Q.has('seed')) {                                                 // reproduzierbarer Zufall (mulberry32)
    let a = (parseInt(Q.get('seed'), 10) || 1) >>> 0;
    Math.random = () => { a = (a + 0x6D2B79F5) >>> 0; let x = a; x = Math.imul(x ^ (x >>> 15), x | 1); x ^= x + Math.imul(x ^ (x >>> 7), x | 61); return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
  }
  if (Q.has('auto')) DEBUG.auto = true;
  if (Q.has('outfit')) game.outfit = H.clamp(parseInt(Q.get('outfit'), 10) || 0, 0, OUTFITS.length - 1);
  if (Q.has('weather')) game.weatherOffset = (parseFloat(Q.get('weather')) || 0) * CONFIG.WEATHER_CYCLE_S;
  if (Q.has('god')) game.god = true;
  const screen = Q.get('screen');
  if (Q.has('section')) DEBUG.forceFirst = Q.get('section');
  if (Q.has('section') || screen === 'play' || Q.has('auto')) startGame();
  else if (screen === 'attract') startAttract();
  else if (screen === 'gameover' || screen === 'name' || screen === 'list') {
    startGame(); world.itemPoints = 230; world.x = 187 * CONFIG.PX_PER_METER; game.meters = 187; game.score = 417;
    finishGame();
    if (screen === 'name') setState(ST.ENTER_NAME);
    if (screen === 'list') { game.goPhase = 'list'; game.highlight = -1; }
  }
  else setState(ST.START);
  if (Q.has('t')) {
    const secs = parseFloat(Q.get('t')) || 0, wasAuto = game.auto;
    game.auto = true;
    for (let i = 0; i < secs * 120; i++) step(STEP);
    game.auto = wasAuto;
  }
  if (Q.has('freeze')) game.freeze = true;
}
function boot() {
  initCanvas(); loadImages(); initInput();
  applyUrlParams();
  requestAnimationFrame(frame);
}
